<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="../../favicon-192.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>¿Está bien tu feed? · Microherramienta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b; --bg-elevated: #111111; --border: #2b2b2b; --border-strong: #404040;
    --fg: #d4d4d4; --fg-muted: #a3a3a3; --fg-strong: #f5f5f5;
    --success: #10b981; --error: #ef4444;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
    --tracking-eyebrow: 0.18em; --tracking-tightest: -0.025em;
    --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
    --shadow-key: 0 1px 0 rgba(255, 255, 255, 0.18);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fg-strong); text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--fg-strong); }
  code { font: 12.5px var(--mono); color: var(--fg-strong); }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--fg-muted); }

  /* La misma carcasa que «Dónde deberías estar»: menú a la izquierda y el contenido en una tarjeta. */
  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 16px 24px; }
  .side-brand { display: inline-flex; align-items: center; gap: 8px; margin: 0 12px 28px; color: var(--fg-muted); text-decoration: none; font-size: 13px; }
  .side-brand img { width: 22px; height: 22px; object-fit: contain; }
  .side-brand:hover { color: var(--fg-strong); }
  .side-title { padding: 0 12px 10px; }
  .nav { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: var(--r-md); cursor: pointer; font-size: 14px; color: var(--fg-muted); transition: background-color 200ms var(--ease), color 200ms var(--ease); }
  .nav:hover { color: var(--fg-strong); background: rgba(17, 17, 17, 0.6); }
  .nav .n { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.4); }
  .nav.is-locked { opacity: 0.35; cursor: not-allowed; }
  .nav.is-locked:hover { color: var(--fg-muted); background: none; }
  .nav .c { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot--success { background: var(--success); }
  .dot--error { background: var(--error); }
  .dot--faint { background: rgba(163, 163, 163, 0.35); }
  .dot--warn { background: #f59e0b; }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }

  main { display: flex; flex-direction: column; margin: 8px 8px 8px 0; min-height: calc(100vh - 16px); padding: 0 24px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-elevated); }
  .intro { margin: 0 -24px; padding: 16px 24px; border-bottom: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .intro__row { display: flex; align-items: center; gap: 14px; }
  .intro__row img { flex: none; width: 26px; height: 26px; border-radius: var(--r-full); object-fit: cover; filter: grayscale(1); }
  h1 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }

  .spacer { flex: 1 0 48px; }
  footer.credit { position: sticky; bottom: 0; margin: 0 -24px; padding: 16px 24px 18px; border-radius: 0 0 var(--r-lg) var(--r-lg); border-top: 1px solid var(--border); background: var(--bg-elevated); display: flex; justify-content: space-between; }
  footer.credit { align-items: center; }
  .credit__sig { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
  .credit__sig img { width: 18px; height: 18px; object-fit: contain; opacity: 0.85; }
  .credit__sig strong { font-weight: 500; color: var(--fg); }
  .credit__sig:hover strong, .credit__talk:hover { color: var(--fg-strong); }
  .credit__talk { text-decoration: none; }

  /* Entrada: un área para soltar o elegir los archivos de logs. */
  form { margin-top: 28px; max-width: 760px; display: grid; gap: 10px; }
  .drop { position: relative; display: grid; place-items: center; gap: 6px; min-height: 180px; padding: 24px; border: 1px dashed var(--border-strong); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.03); text-align: center; cursor: pointer; transition: border-color 150ms var(--ease), background-color 150ms var(--ease); }
  .drop:hover, .drop.is-over { border-color: var(--fg-muted); background: rgba(255, 255, 255, 0.05); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop strong { font-weight: 500; color: var(--fg-strong); }
  .drop span { font-size: 13px; color: var(--fg-muted); }
  form small { font-size: 13px; color: var(--fg-muted); }
  .msg { margin: 0; font-size: 13px; color: var(--fg-muted); }
  .msg.is-bad { color: var(--error); }

  /* Resultado */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--r-lg); margin-top: 32px; }
  .metric { padding: 20px 22px; }
  .metric + .metric { border-left: 1px solid var(--border); }
  .metric b { display: block; margin-bottom: 6px; font-size: 32px; font-weight: 500; line-height: 1; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .metric span { font-size: 13px; color: var(--fg-muted); }
  .metric b small { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--fg-muted); }
  .metric.is-bad b { color: #fca5a5; }
  .metrics { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
  .metric--main { display: flex; flex-direction: column; justify-content: center; }
  .metric--main b { font-size: 40px; }
  .metric--list { display: grid; gap: 2px; padding: 12px 14px; }
  .sum__row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 6px 52px minmax(0, 1fr); gap: 12px; align-items: center; padding: 6px 8px; border-radius: var(--r-sm); cursor: pointer; font-size: 13px; color: var(--fg); }
  .sum__row:hover { background: rgba(255, 255, 255, 0.04); }
  .sum__row b { font: 500 14px var(--mono); color: var(--fg-strong); }
  .sum__row b.is-bad { color: #fca5a5; }
  .sum__row b small { font-size: 12px; font-weight: 400; color: var(--fg-muted); }
  .scope { margin: 6px 0 0; max-width: 820px; font-size: 12px; line-height: 1.6; color: var(--fg-muted); }
  .scope a { color: var(--fg); }
  .period { margin: 10px 0 0; font: 12px var(--mono); color: var(--fg-muted); }
  .kind__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 14px; }
  .kind__head p { margin: 2px 0 0; font-size: 13px; color: var(--fg-muted); }
  .kind__head .kind__sum { display: inline-flex; align-items: center; gap: 8px; flex: none; margin: 0; }
  .kind__sum.is-bad { color: #fca5a5; }
  .kind { margin-top: 32px; scroll-margin-top: 16px; }
  .kind h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .kind > p { margin: 2px 0 12px; font-size: 13px; color: var(--fg-muted); }
  /* Filas: una columna por dato, con su cabecera, como el ranking de «Dónde deberías estar». */
  .cols, .bot__row { display: grid; grid-template-columns: 180px minmax(120px, 1fr) 130px 80px 80px 90px 16px; gap: 16px; align-items: center; }
  .cols { padding: 0 8px 8px; font-size: 12px; color: var(--fg-muted); }
  .cols .r, .bot__n { text-align: right; }
  .bots { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  .bot { border-bottom: 1px solid var(--border); }
  .bot__row { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 180px minmax(120px, 1fr) 130px 80px 80px 90px 16px; gap: 16px; align-items: center; padding: 12px 4px; }
  .bot__row:hover { background: rgba(255, 255, 255, 0.02); }
  .bot__token { font: 13px var(--mono); color: var(--fg-strong); overflow-wrap: anywhere; }
  .bot__who { font-size: 13px; color: var(--fg); min-width: 0; }
  .bot__n { font: 13px var(--mono); color: var(--fg); }
  .bot__n.is-bad { color: #fca5a5; }
  .bot__n.is-none { color: rgba(163, 163, 163, 0.4); }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-strong); }
  .chev { color: var(--fg-muted); transition: transform 200ms var(--ease); }
  .bot.is-open .chev { transform: rotate(180deg); }
  /* Desplegable: respuestas y páginas, lado a lado, en una tarjeta bajo la fila. */
  .bot__more { display: none; margin: 0 4px 14px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.02); }
  .bot.is-open .bot__more { display: block; }
  .more__grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 28px; }
  .more__title { margin: 0 0 10px; }
  .codes, .pages { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .codes li { display: grid; grid-template-columns: 40px minmax(0, 1fr) 64px; gap: 10px; align-items: center; font: 12px var(--mono); color: var(--fg); }
  .codes li span:last-child, .pages li span:last-child { text-align: right; color: var(--fg-muted); }
  .bar { height: 6px; border-radius: var(--r-full); background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: inherit; background: var(--success); }
  .codes li.is-bad { color: #fca5a5; }
  .codes li.is-bad .bar i { background: var(--error); }
  .codes li.is-gone .bar i { background: var(--fg-muted); }
  .pages li { display: flex; justify-content: space-between; gap: 16px; font: 12px var(--mono); color: var(--fg); }
  .pages li span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pages li span:last-child { flex: none; }
  .more__foot { margin: 14px 0 0; font-size: 13px; color: var(--fg-muted); }
  .more__foot a { color: var(--fg); }
  .warn { margin: 16px 0 0; max-width: 760px; font-size: 13px; color: var(--fg-muted); }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); } aside { position: static; height: auto; padding-bottom: 12px; } .side-foot { margin-top: 20px; }
    main { margin: 0 8px 8px; padding: 0 16px; } footer.credit, .intro { margin: 0 -16px; padding: 16px; }
    .metrics { grid-template-columns: 1fr; } .metric + .metric { border-left: 0; border-top: 1px solid var(--border); }
    .cols { display: none; }
    .bot__row { grid-template-columns: 1fr auto 16px; row-gap: 4px; }
    .bot__who { grid-column: 1; grid-row: 2; }
    .bot__row .state { grid-column: 2; grid-row: 1; }
    .bot__n { grid-row: 3; text-align: left; }
    .bot__n::before { content: attr(data-l) ' '; color: var(--fg-muted); }
    .bot__n[data-k="v"] { grid-column: 1; } .bot__n[data-k="e"] { grid-column: 2; } .bot__n[data-k="u"] { display: none; }
    .chev { grid-column: 3; grid-row: 1; }
    .more__grid { grid-template-columns: 1fr; gap: 18px; }
  }

  /* Comprobaciones: nombre, atributo, estado y productos afectados. */
  .cols, .bot__row { grid-template-columns: minmax(200px, 1fr) 200px 120px 90px 16px; gap: 24px; }
  .bot__row { padding: 14px 8px; }
  .bot__attr code { padding: 1px 6px; border: 1px solid var(--border); border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.04); font-size: 12px; color: var(--fg); }
  .bot__more { margin: 0 8px 16px; padding: 18px 20px; }
  .facts { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 14px 28px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--fg-muted); }
  .facts dd { margin: 0; min-width: 0; color: var(--fg); }
  .facts dd a { color: var(--fg-strong); }
  .facts code { padding: 1px 6px; border: 1px solid var(--border); border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.04); }
  .ptable { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .ptable__head, .ptable__row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; align-items: center; padding: 8px 12px; }
  .ptable__head.is-one, .ptable__row.is-one { grid-template-columns: minmax(0, 1fr); }
  .ptable__head { font-size: 12px; color: var(--fg-muted); border-bottom: 1px solid var(--border); }
  .ptable__row + .ptable__row { border-top: 1px solid var(--border); }
  .ptable__id, .ptable__val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--fg-strong); }
  .ptable__val { color: #fca5a5; }
  .ptable__more { margin: 0; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--fg-muted); }
  .linkbtn { all: unset; cursor: pointer; margin-left: 6px; color: var(--fg-strong); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .linkbtn:hover { text-decoration-color: var(--fg-strong); }
  .bot__name { font-size: 14px; color: var(--fg-strong); }
  .bot__attr { font: 12.5px var(--mono); color: var(--fg-muted); overflow-wrap: anywhere; }
  .more__rule { margin: 0 0 12px; font-size: 13px; color: var(--fg); }
  .more__rule a { color: var(--fg); }
  .examples li span:first-child { color: var(--fg-strong); }
  .examples li span:last-child { max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #fca5a5; }
  .ex__head { display: flex; justify-content: space-between; margin: 0 0 8px; }
  .more__rule code { padding: 1px 6px; border: 1px solid var(--border); border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.04); }
  @media (max-width: 860px) {
    .bot__row { grid-template-columns: 1fr auto 16px; }
    .bot__name { grid-column: 1; grid-row: 1; }
    .bot__attr { grid-column: 1; grid-row: 2; }
    .bot__n[data-k="n"] { grid-column: 1; grid-row: 3; }
    .kind__head { flex-direction: column; align-items: flex-start; gap: 8px; }
    .sum__row { grid-template-columns: 6px 40px minmax(0, 1fr); }
    .facts { grid-template-columns: 1fr; gap: 4px; } .facts dd + dt { margin-top: 12px; }
    .bot__more { padding: 14px 16px; }
  }
</style>

<script>
// ---------- Lector de feeds ----------
// Lee el feed por trozos y entrega cada producto como { atributo: [valores] }.
// Formatos: texto separado por tabuladores o por comas (con cabecera) y XML (RSS 2.0 con <item> o Atom con <entry>).

const ENT = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
const unxml = s => s
  .replace(/<!\[CDATA\[([\s\S]*?)\]\]>/g, (_, c) => c.replace(/&/g, '\u0000amp;'))
  .replace(/&(#x[0-9a-f]+|#\d+|\w+);/gi, (m, e) => e[0] === '#' ? String.fromCodePoint(e[1].toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : +e.slice(1)) : ENT[e] ?? m)
  .replace(/\u0000amp;/g, '&')
  .trim();

// Un <item> o <entry>: cada etiqueta hija es un atributo; las repetidas se acumulan.
// Las que llevan subetiquetas (shipping, product_detail…) se guardan como texto «sub:valor».
function readXmlItem(xml) {
  const p = {};
  const re = /<(?:g:)?([A-Za-z_]+)(?:\s[^>]*)?>([\s\S]*?)<\/(?:g:)?\1>|<(?:g:)?([A-Za-z_]+)(?:\s[^>]*?)?\/>/g;
  let m;
  while ((m = re.exec(xml))) {
    const k = (m[1] || m[3]).toLowerCase();
    let v = m[2] ?? '';
    if (/<(?:g:)?[A-Za-z_]+[\s>]/.test(v)) {
      const parts = [];
      v.replace(/<(?:g:)?([A-Za-z_]+)(?:\s[^>]*)?>([\s\S]*?)<\/(?:g:)?\1>/g, (_, sk, sv) => { parts.push(sk.toLowerCase() + ':' + unxml(sv)); });
      v = parts.join(':');
    } else v = unxml(v);
    // En Atom el enlace va en <link href="…"/>
    if (k === 'link' && !v) { const h = /href="([^"]*)"/.exec(m[0]); if (h) v = unxml(h[1]); }
    (p[k] = p[k] || []).push(v);
  }
  return p;
}

// Una línea de texto separado: respeta las comillas dobles (y las dobles dobles dentro).
function splitRow(line, sep) {
  if (!line.includes('"')) return line.split(sep);
  const out = []; let cur = '', q = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"' && cur === '') q = true;
    else if (c === sep) { out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

// Nombres de columna: «g:price», «Price» o «price [precio]» valen como «price».
const colName = h => h.trim().replace(/^\uFEFF/, '').replace(/^g:/i, '').replace(/\s*\[.*\]$/, '').toLowerCase();

async function readFeed(file, onProduct, onProgress) {
  let stream = file.stream();
  if (/\.gz$/i.test(file.name) || await isGzip(file)) stream = stream.pipeThrough(new DecompressionStream('gzip'));
  const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
  let mode = null, buf = '', header = null, sep = '\t', n = 0, pending = '';
  const emit = p => { n++; onProduct(p); };
  for (;;) {
    const { done, value } = await reader.read();
    if (value) buf += value;
    if (!mode) {
      const head = buf.replace(/^\uFEFF/, '').trimStart();
      if (!head && !done) continue;
      mode = head[0] === '<' ? 'xml' : 'text';
    }
    if (mode === 'xml') {
      // Saca cada <item>…</item> o <entry>…</entry> completo y deja el resto en el búfer
      const re = /<(item|entry)(?:\s[^>]*)?>([\s\S]*?)<\/\1>/g;
      let m, last = 0;
      while ((m = re.exec(buf))) { emit(readXmlItem(m[2])); last = re.lastIndex; }
      buf = buf.slice(last);
      if (buf.length > 1e6 && !/<(item|entry)[\s>]/.test(buf)) buf = buf.slice(-2000);
    } else {
      const lines = (pending + buf).split(/\r?\n/);
      buf = '';
      pending = done ? '' : lines.pop();
      for (const l of lines) {
        if (!l.trim()) continue;
        if (!header) {
          sep = l.includes('\t') ? '\t' : l.includes(';') && !l.includes(',') ? ';' : ',';
          header = splitRow(l, sep).map(colName);
          continue;
        }
        const v = splitRow(l, sep), p = {};
        header.forEach((h, i) => { const x = (v[i] ?? '').trim(); if (h) (p[h] = p[h] || []).push(...(x ? [x] : [])); });
        emit(p);
      }
    }
    onProgress(n);
    if (done) break;
  }
  return { mode, sep, header, count: n };
}

async function isGzip(file) {
  const b = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  return b[0] === 0x1f && b[1] === 0x8b;
}

// ---------- Comprobaciones ----------
// Cada una sale de la especificación de datos de producto de Google Merchant Center y de la ayuda de cada atributo, revisadas el 5 de noviembre de 2026.
const REVIEWED = '5 de noviembre de 2026';
const SPEC = 'https://support.google.com/merchants/answer/7052112';
const val = (p, k) => (p[k] || []).find(x => x !== '') ?? null;
const vals = (p, k) => (p[k] || []).filter(x => x !== '');
const isUrl = v => /^https?:\/\/\S+$/i.test(v) && v.length <= 2000;

// Dígito de control de GS1, para GTIN de 8, 12, 13 y 14 cifras.
function gtinOk(d) {
  const n = d.split('').map(Number), check = n.pop();
  const sum = n.reverse().reduce((s, x, i) => s + x * (i % 2 ? 1 : 3), 0);
  return (10 - sum % 10) % 10 === check;
}
// Prefijos que Google no acepta: los de uso restringido (02, 04, 2) y los de cupones (05, 98, 99).
function gtinProblem(raw) {
  const d = raw.replace(/[\s-]/g, '');
  if (!/^\d+$/.test(d) || ![8, 12, 13, 14].includes(d.length)) return 'no tiene 8, 12, 13 o 14 cifras';
  if (!gtinOk(d)) return 'el dígito de control no cuadra';
  const core = d.padStart(14, '0').slice(1);
  if (d.length > 8 && /^(2|02|04|05|98|99)/.test(core)) return 'empieza por un prefijo que Google no acepta';
  return null;
}

const CHECKS = [
  // Obligatorios: sin ellos, Google no muestra el producto
  { id: 'id', rule: 'Obligatorio. Único y estable, de hasta 50 caracteres.', group: 'req', attr: 'id', name: 'Identificador', test: p => !val(p, 'id') && 'Falta' },
  { id: 'title', rule: 'Obligatorio. Hasta 150 caracteres.', group: 'req', attr: 'title', name: 'Título', test: p => !val(p, 'title') && 'Falta' },
  { id: 'description', rule: 'Obligatoria. Hasta 5000 caracteres.', group: 'req', attr: 'description', name: 'Descripción', test: p => !val(p, 'description') && 'Falta' },
  { id: 'link', rule: 'Obligatorio. Empieza por http o https.', group: 'req', attr: 'link', name: 'Enlace a la página', test: p => !val(p, 'link') && 'Falta' },
  { id: 'image_link', rule: 'Obligatorio. Empieza por http o https.', group: 'req', attr: 'image_link', name: 'Imagen principal', test: p => !val(p, 'image_link') && 'Falta' },
  { id: 'availability', rule: 'Obligatoria: in_stock, out_of_stock, preorder o backorder.', group: 'req', attr: 'availability', name: 'Disponibilidad', test: p => !val(p, 'availability') && 'Falta' },
  { id: 'price', rule: 'Obligatorio: número y moneda ISO 4217, como «89.95 EUR».', group: 'req', attr: 'price', name: 'Precio', test: p => !val(p, 'price') && 'Falta' },
  { id: 'brand', rule: 'Obligatoria si el producto tiene una marca o un fabricante claro, sea nuevo o no. Opcional si no la tiene, como libros, películas o música.', group: 'cond', attr: 'brand', name: 'Marca', test: p => !val(p, 'brand') && 'Falta' },
  { id: 'availability_date', rule: 'Obligatoria si la disponibilidad es preorder o backorder.', group: 'cond', attr: 'availability_date', name: 'Fecha de disponibilidad (preventa y bajo pedido)', test: p => /^(preorder|backorder)$/i.test(val(p, 'availability') || '') && !val(p, 'availability_date') && 'Falta' },

  // Formato: valores que Google no acepta como están
  { id: 'id_dup', expect: 'un id distinto en cada producto', rule: 'Cada producto necesita un identificador único.', group: 'fmt', attr: 'id', name: 'Identificador repetido', test: (p, st) => { const v = val(p, 'id'); if (!v) return false; if (st.ids.has(v)) return 'repetido'; st.ids.add(v); return false; } },
  { id: 'id_len', expect: '50 caracteres como máximo', rule: 'Hasta 50 caracteres.', group: 'fmt', attr: 'id', name: 'Identificador, largo', test: p => (val(p, 'id') || '').length > 50 && val(p, 'id') },
  { id: 'title_len', expect: '150 caracteres como máximo', rule: 'Hasta 150 caracteres.', group: 'fmt', attr: 'title', name: 'Título, largo', test: p => (val(p, 'title') || '').length > 150 && `${val(p, 'title').length} caracteres` },
  { id: 'desc_len', expect: '5000 caracteres como máximo', rule: 'Hasta 5000 caracteres.', group: 'fmt', attr: 'description', name: 'Descripción, larga', test: p => (val(p, 'description') || '').length > 5000 && `${val(p, 'description').length} caracteres` },
  { id: 'link_fmt', expect: 'https://… sin espacios', rule: 'Empieza por http o https, sin espacios y con hasta 2000 caracteres.', group: 'fmt', attr: 'link', name: 'Enlace a la página', test: p => { const v = val(p, 'link'); return v && !isUrl(v) && v; } },
  { id: 'img_fmt', expect: 'https://… sin espacios', rule: 'Empieza por http o https, sin espacios y con hasta 2000 caracteres.', group: 'fmt', attr: 'image_link', name: 'Imagen principal', test: p => { const v = val(p, 'image_link'); return v && !isUrl(v) && v; } },
  { id: 'avail_val', expect: 'in_stock · out_of_stock · preorder · backorder', rule: 'Valores: in_stock, out_of_stock, preorder o backorder.', group: 'fmt', attr: 'availability', name: 'Disponibilidad', test: p => { const v = val(p, 'availability'); return v && !/^(in_stock|out_of_stock|preorder|backorder)$/.test(v) && v; } },
  { id: 'price_fmt', expect: '89.95 EUR', rule: 'Número con punto decimal y moneda ISO 4217, mayor que 0: «89.95 EUR».', group: 'fmt', attr: 'price', name: 'Precio', test: p => { const v = val(p, 'price'); if (!v) return false; const m = /^(\d+(?:\.\d+)?)\s+[A-Z]{3}$/.exec(v); return (!m || +m[1] <= 0) && v; } },
  { id: 'sale_fmt', expect: '79.95 EUR', rule: 'Mismo formato que el precio: «79.95 EUR».', group: 'fmt', attr: 'sale_price', name: 'Precio rebajado', test: p => { const v = val(p, 'sale_price'); return v && !/^\d+(?:\.\d+)?\s+[A-Z]{3}$/.test(v) && v; } },
  { id: 'cond_val', expect: 'new · refurbished · used', rule: 'Valores: new, refurbished o used.', group: 'fmt', attr: 'condition', name: 'Estado del producto', test: p => { const v = val(p, 'condition'); return v && !/^(new|refurbished|used)$/.test(v) && v; } },
  { id: 'gtin_val', expect: '8, 12, 13 o 14 cifras, con su dígito de control y sin prefijos restringidos (02, 04, 2) ni de cupones', rule: '8, 12, 13 o 14 cifras, con su dígito de control, y sin prefijos restringidos (02, 04, 2) ni de cupones.', group: 'fmt', attr: 'gtin', name: 'GTIN', test: p => { const v = val(p, 'gtin'); if (!v) return false; const why = gtinProblem(v); return why && `${v}: ${why}`; } },
  { id: 'brand_val', expect: 'la marca real, o vacío si no tiene', rule: 'Google pide no poner «N/A», «Generic», «No brand» ni «Does not exist». Si no tiene marca, déjala vacía.', group: 'fmt', attr: 'brand', name: 'Marca de relleno', test: p => { const v = val(p, 'brand'); return v && /^(n\/a|generic|no brand|does not exist)$/i.test(v.trim()) && v; } },
  { id: 'idex_val', expect: 'yes · no · true · false', rule: 'Valores: yes, no, true o false.', group: 'fmt', attr: 'identifier_exists', name: 'Sin identificador', test: p => { const v = val(p, 'identifier_exists'); return v && !/^(yes|no|true|false)$/.test(v) && v; } },
  { id: 'gender_val', expect: 'male · female · unisex', rule: 'Valores: male, female o unisex.', group: 'fmt', attr: 'gender', name: 'Género', test: p => { const v = val(p, 'gender'); return v && !/^(male|female|unisex)$/.test(v) && v; } },
  { id: 'hl_val', expect: 'de 2 a 100 puntos, de hasta 150 caracteres', rule: 'Entre 2 y 100 puntos, de hasta 150 caracteres cada uno.', group: 'fmt', attr: 'product_highlight', name: 'Puntos destacados', test: p => { const v = vals(p, 'product_highlight'); if (!v.length) return false; if (v.length < 2) return 'solo 1'; const l = v.find(x => x.length > 150); return l ? `${l.length} caracteres` : false; } },
  { id: 'age_val', expect: 'newborn · infant · toddler · kids · adult', rule: 'Valores: newborn, infant, toddler, kids o adult.', group: 'fmt', attr: 'age_group', name: 'Edad', test: p => { const v = val(p, 'age_group'); return v && !/^(newborn|infant|toddler|kids|adult)$/.test(v) && v; } },

  // Recomendados: Google los recomienda; sin ellos, el producto puede tener visibilidad limitada
  { id: 'gtin', rule: 'Google lo recomienda si el fabricante le asignó un GTIN: sin él, el producto puede tener visibilidad limitada. Si no tiene GTIN, el MPN; y si no tiene ninguno, identifier_exists con el valor no. Solo con el archivo no sabemos si tu producto tiene GTIN: revísalo.', warn: true, group: 'rec', attr: 'gtin', name: 'GTIN o MPN', test: p => !val(p, 'gtin') && !val(p, 'mpn') && !/^(no|false)$/.test(val(p, 'identifier_exists') || '') && 'Falta' },

  // Más allá del mínimo: no son obligatorios, pero explican mejor tu producto
  { id: 'ctx_product_type', group: 'more', attr: 'product_type', name: 'Tipo de producto', rule: 'Tu categoría, con su ruta completa.', test: p => !val(p, 'product_type') && 'Falta' },
  { id: 'ctx_google_product_category', group: 'more', attr: 'google_product_category', name: 'Categoría de Google', rule: 'Un número o una ruta de la taxonomía de Google.', test: p => !val(p, 'google_product_category') && 'Falta' },
  { id: 'ctx_product_detail', group: 'more', attr: 'product_detail', name: 'Ficha técnica', rule: 'Pares de dato y valor, como «Peso: 250 g».', test: p => !val(p, 'product_detail') && 'Falta' },
  { id: 'ctx_product_highlight', group: 'more', attr: 'product_highlight', name: 'Puntos destacados', rule: 'De 2 a 100 frases cortas sobre el producto.', test: p => !val(p, 'product_highlight') && 'Falta' },
];

const GROUPS = {
  req: { title: 'Obligatorios', short: 'Obligatorios', text: 'Siempre. Sin ellos, Google no muestra el producto.' },
  cond: { title: 'Condicionales', short: 'Condicionales', text: 'Obligatorios en algunos casos.' },
  fmt: { title: 'Formato', short: 'Formato', text: 'Valores que Google no acepta tal como están.' },
  rec: { title: 'Recomendados', short: 'Recomendados', text: 'Google los recomienda: sin ellos, el producto puede tener visibilidad limitada.' },
  more: { title: 'Más allá del mínimo', short: 'Más allá del mínimo', text: 'No son obligatorios, pero explican mejor tu producto.' },
};

const isErr = c => c.group !== 'more' && !c.warn;

function emptyStats() {
  return { products: 0, bad: 0, ids: new Set(), groups: { req: 0, cond: 0, fmt: 0, rec: 0, more: 0 }, checks: CHECKS.map(() => ({ n: 0, ex: [] })) };
}

function checkProduct(st, p) {
  st.products++;
  let bad = false;
  const hit = new Set();
  const pid = val(p, 'id') || `(fila ${st.products})`;
  CHECKS.forEach((c, i) => {
    const r = c.test(p, st);
    if (!r) return;
    hit.add(c.group);
    const s = st.checks[i];
    s.n++;
    if (s.ex.length < 1000) s.ex.push([pid, r === 'Falta' ? '' : String(r)]);
    if (isErr(c)) bad = true;
  });
  if (bad) st.bad++;
  hit.forEach(g => st.groups[g]++);
}

// ---------- Interfaz ----------
// Cuenta el uso de la herramienta en GoatCounter: solo el nombre del evento, nunca el feed.
const track = name => { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => n.toLocaleString('es-ES');
let results = null, busy = false;

function say(text, bad) { const el = $('#msg'); el.textContent = text; el.hidden = !text; el.classList.toggle('is-bad', !!bad); }

const drop = $('.drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('is-over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('is-over')));
drop.addEventListener('drop', e => { e.preventDefault(); run([...e.dataTransfer.files]); });
$('#files').addEventListener('change', e => run([...e.target.files]));
$('#reset').addEventListener('click', () => { $('#files').value = ''; say(''); results = null; $('#result').hidden = true; $('#form').hidden = false; renderNav(); window.scrollTo({ top: 0 }); });

async function run(files) {
  if (!files.length || busy) return;
  busy = true;
  results = null; $('#result').hidden = true; renderNav();
  const st = emptyStats();
  const f = files[0];
  try {
    say(`Leyendo ${f.name}…`);
    const info = await readFeed(f, p => checkProduct(st, p), n => say(`Leyendo ${f.name}… ${num(n)} productos`));
    if (!st.products) return say('No encontramos productos en ese archivo. Tiene que ser un feed en XML o en texto con tabuladores, con una fila de cabecera.', true);
    // Un feed tiene que traer al menos alguno de los atributos básicos; si no, no es un feed (por ejemplo, un log)
    const basics = ['id', 'title', 'link', 'price', 'availability', 'image_link'];
    if (info.mode === 'text' && !(info.header || []).some(h => basics.includes(h))) return say('Esto no parece un feed de productos: la primera fila no trae ninguno de sus atributos, como id, title o price. Sube el archivo que envías a Google Merchant Center.', true);
    say('');
    render(st, info);
    track('feed-comprobar');
  } catch (err) {
    say('No hemos podido leer el archivo. Tiene que ser XML o texto, o uno de los dos comprimido en .gz.', true);
  } finally { busy = false; $('#files').value = ''; }
}

function stateOf(c, s) {
  if (!s.n) return ['dot--success', 'Bien'];
  if (c.group === 'fmt') return ['dot--error', 'Incorrecto'];
  if (c.group === 'rec') return ['dot--warn', 'Revisa'];
  return [isErr(c) ? 'dot--error' : 'dot--faint', 'Falta'];
}

function render(st, info) {
  results = CHECKS.map((c, i) => ({ ...c, ...st.checks[i] }));
  const fmt = info.mode === 'xml' ? 'XML' : info.sep === '\t' ? 'Texto con tabuladores' : info.sep === ',' ? 'Texto con comas' : 'Texto con punto y coma';
  const pct = Math.round(st.bad / st.products * 100);
  const used = results.filter(r => r.group === 'more' && r.n < st.products).length, ctxTotal = results.filter(r => r.group === 'more').length;
  const line = (k, n, text, tone) => `<button class="sum__row" type="button" data-k="${k}"><span class="dot ${n ? tone : 'dot--success'}"></span><b class="${n && tone === 'dot--error' ? 'is-bad' : ''}">${num(n)}</b><span class="sum__txt">${text}</span></button>`;
  const prod = n => n === 1 ? 'producto' : 'productos';
  $('#metrics').innerHTML =
    `<div class="metric metric--main${st.bad ? ' is-bad' : ''}"><b>${num(st.bad)}<small> de ${num(st.products)}</small></b><span>${prod(st.products)} no ${st.bad === 1 ? 'cumple' : 'cumplen'} lo mínimo de Google${st.bad ? ` · el ${pct} %` : ''}</span></div>` +
    `<div class="metric metric--list">` +
      line('req', st.groups.req, `${prod(st.groups.req)} sin algún dato obligatorio`, 'dot--error') +
      line('cond', st.groups.cond, `${prod(st.groups.cond)} sin un dato obligatorio en su caso`, 'dot--error') +
      line('fmt', st.groups.fmt, `${prod(st.groups.fmt)} con algún formato incorrecto`, 'dot--error') +
      line('rec', st.groups.rec, `${prod(st.groups.rec)} sin GTIN ni MPN: revisa si lo tienen`, 'dot--warn') +
      `<button class="sum__row" type="button" data-k="more"><span class="dot ${used === ctxTotal ? 'dot--success' : 'dot--faint'}"></span><b>${used}<small> de ${ctxTotal}</small></b><span class="sum__txt">atributos de contexto que usas</span></button>` +
    `</div>`;
  $('#period').innerHTML = `${esc(fmt)} · ${num(st.products)} ${st.products === 1 ? 'producto leído' : 'productos leídos'} · Tu feed no sale de tu navegador`;
  $('#scope').innerHTML = `Según la <a href="${SPEC}" target="_blank" rel="noopener">especificación de datos de producto de Google</a>, revisada el ${REVIEWED}. Revisa el archivo: Merchant Center comprueba además las imágenes, que el precio coincida con tu web y sus políticas, y eso esta herramienta no lo ve. Un producto puede tener más de un tipo de error.`;
  const warn = [];
  if (info.mode === 'text' && info.sep !== '\t') warn.push('Tu archivo va separado por comas o punto y coma. Google pide texto separado por tabuladores (.tsv o .txt) o XML.');
  if (info.mode === 'text' && info.header && !info.header.includes('id')) warn.push('No vemos la columna «id» en la cabecera. Revisa que la primera fila tenga los nombres de los atributos en inglés, como id, title o price.');
  $('#warn').innerHTML = warn.map(esc).join(' ');
  $('#warn').hidden = !warn.length;
  $('#kinds').innerHTML = Object.entries(GROUPS).map(([k, g]) => `
    <section class="kind" id="k-${k}"><header class="kind__head"><div><h2>${g.title}</h2><p>${g.text}</p></div>${groupSummary(k)}</header>
      <div class="cols"><span>Comprobación</span><span>Atributo</span><span>Estado</span><span class="r">Productos</span><span></span></div>
      <ul class="bots">${results.filter(r => r.group === k).map(row).join('')}</ul></section>`).join('');
  $('#result').hidden = false;
  $('#form').hidden = true; window.scrollTo({ top: 0 });
  renderNav();
}

// Cómo va cada bloque, en una línea: cuántas comprobaciones tienen problemas
function groupSummary(k) {
  const rows = results.filter(r => r.group === k), bad = rows.filter(r => r.n);
  if (!bad.length) return `<p class="kind__sum"><span class="dot dot--success"></span>Todo bien</p>`;
  const err = bad.some(isErr);
  const tone = err ? 'dot--error' : k === 'rec' ? 'dot--warn' : 'dot--faint';
  return `<p class="kind__sum${err ? ' is-bad' : ''}"><span class="dot ${tone}"></span>${bad.length} de ${rows.length} ${err ? 'con errores' : k === 'rec' ? 'para revisar' : 'con algo que mejorar'}</p>`;
}

// Tabla de productos afectados: los primeros 10 y «Ver más» de 20 en 20
function examplesTable(r, limit = 10) {
  const missing = r.group !== 'fmt';
  const shown = r.ex.slice(0, limit), rest = r.n - shown.length, canMore = r.ex.length > shown.length;
  return `<div class="ptable__head${missing ? ' is-one' : ''}"><span>Producto</span>${missing ? '' : '<span>Lo que tiene</span>'}</div>
    ${shown.map(([id, v]) => `<div class="ptable__row${missing ? ' is-one' : ''}"><span class="ptable__id" title="${esc(id)}">${esc(id)}</span>${missing ? '' : `<span class="ptable__val" title="${esc(v)}">${esc(v)}</span>`}</div>`).join('')}
    ${rest > 0 ? `<p class="ptable__more">Y ${num(rest)} ${rest === 1 ? 'producto más' : 'productos más'}.${canMore ? ` <button class="linkbtn" type="button" data-more="${limit + 20}">Ver ${Math.min(20, r.ex.length - shown.length)} más</button>` : ''}</p>` : ''}`;
}

function row(r, i) {
  const [dot, label] = stateOf(r, r);
  const missing = r.group !== 'fmt';
  const facts = [`<dt>Qué pide Google</dt><dd>${r.expect ? `Tiene que ser: <code>${esc(r.expect)}</code>` : esc(r.rule)}</dd>`];
  if (r.n) facts.push(`<dt>${missing ? 'Productos sin este dato' : 'Productos con este error'}</dt><dd><div class="ptable">${examplesTable(r)}</div></dd>`);
  facts.push(`<dt>Fuente</dt><dd><a href="${SPEC}" target="_blank" rel="noopener">Especificación de datos de producto de Google</a></dd>`);
  return `<li class="bot" data-i="${CHECKS.indexOf(CHECKS.find(c => c.id === r.id))}"><button class="bot__row" type="button" aria-expanded="false">
      <span class="bot__name">${esc(r.name)}</span>
      <span class="bot__attr"><code>${esc(r.attr)}</code></span>
      <span class="state"><span class="dot ${dot}"></span>${label}</span>
      <span class="bot__n ${r.n ? (isErr(r) ? 'is-bad' : '') : 'is-none'}" data-k="n" data-l="Productos">${r.n ? num(r.n) : '—'}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="bot__more"><dl class="facts">${facts.join('')}</dl></div></li>`;
}

// Menú: un punto por grupo; rojo si hay errores, gris si faltan recomendados y verde si todo está bien.
function renderNav() {
  $('#nav').innerHTML = Object.entries(GROUPS).map(([k, g], i) => {
    const rows = results ? results.filter(r => r.group === k) : [];
    const n = rows.reduce((s, r) => s + (r.n ? 1 : 0), 0);
    const dot = !n ? 'dot--success' : rows.some(r => r.n && isErr(r)) ? 'dot--error' : k === 'rec' ? 'dot--warn' : 'dot--faint';
    const tip = !n ? 'Todo bien' : `${n} ${n === 1 ? 'comprobación' : 'comprobaciones'} con problemas`;
    return `<button class="nav ${results ? '' : 'is-locked'}" data-k="${k}" title="${results ? tip : 'Sube primero tu feed'}"><span class="n">0${i + 1}</span><span>${g.short}</span><span class="c">${results ? `<span class="dot ${dot}"></span>` : ''}</span></button>`;
  }).join('');
}
$('#metrics').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b && results) document.getElementById('k-' + b.dataset.k).scrollIntoView({ behavior: 'smooth' });
});
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b && results) document.getElementById('k-' + b.dataset.k).scrollIntoView({ behavior: 'smooth' });
});
$('#kinds').addEventListener('click', e => {
  const more = e.target.closest('[data-more]');
  if (more) {
    const li = more.closest('.bot');
    li.querySelector('.ptable').innerHTML = examplesTable(results[+li.dataset.i], +more.dataset.more);
    return;
  }
  const r = e.target.closest('.bot__row');
  if (!r) return;
  const li = r.parentElement;
  li.classList.toggle('is-open');
  r.setAttribute('aria-expanded', li.classList.contains('is-open'));
});

renderNav();
</script>
</body>
</html>
