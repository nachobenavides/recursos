<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="../../favicon-192.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>Dónde deberías estar · Seguimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b; --bg-elevated: #111111; --border: #2b2b2b; --border-strong: #404040;
    --fg: #d4d4d4; --fg-muted: #a3a3a3; --fg-strong: #f5f5f5;
    --success: #10b981; --error: #ef4444;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
    --tracking-eyebrow: 0.18em; --tracking-tightest: -0.025em;
    --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
    --shadow-key: 0 1px 0 rgba(255, 255, 255, 0.18);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fg-strong); }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--fg-muted); }
  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }

  aside { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 16px 24px; }
  /* Miga de pan para volver al ejercicio o al listado de charlas. */
  .side-brand { display: inline-flex; align-items: center; gap: 10px; margin: 0 12px 28px; color: var(--fg); text-decoration: none; font-size: 12px; letter-spacing: 0.04em; }
  .side-brand img { width: 22px; height: 22px; object-fit: contain; }
  .side-brand:hover { color: var(--fg-strong); }
  .side-title { padding: 0 12px 10px; }
  .nav { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: var(--r-md); cursor: pointer; font-size: 14px; color: var(--fg-muted); transition: background-color 200ms var(--ease), color 200ms var(--ease); }
  .nav:hover { color: var(--fg-strong); background: rgba(17, 17, 17, 0.6); }
  .nav.is-on { color: var(--fg-strong); background: var(--bg-elevated); box-shadow: inset 0 0 0 1px var(--border); }
  .nav .n { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.4); }
  .nav.is-on .n { color: var(--fg-muted); }
  .nav.is-locked { opacity: 0.35; cursor: not-allowed; }
  .nav.is-locked:hover { color: var(--fg-muted); background: none; }
  .nav .c { margin-left: auto; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; color: var(--fg-muted); }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot--success { background: var(--success); }
  .dot--error { background: var(--error); }
  .dot--strong { background: var(--fg-strong); }
  .dot--faint { background: rgba(163, 163, 163, 0.25); }
  /* Abajo, lo que se hace con el trabajo guardado, con la misma forma que los pasos del menú. */
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }

  /* El contenido va en una tarjeta más clara, casi pegada a los bordes de la ventana; el menú queda a su izquierda. */
  main { display: flex; flex-direction: column; margin: 8px 8px 8px 0; min-height: calc(100vh - 16px); padding: 0 24px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-elevated); }
  /* Cabecera de cada paso: una fila fija (foto y título) y, debajo, la explicación del paso, que se despliega como un
     comentario sin mover la fila. */
  .intro { margin: 0 -24px; padding: 16px 24px; border-bottom: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .intro__row { display: flex; align-items: center; gap: 14px; }
  .intro__row img { flex: none; width: 26px; height: 26px; border-radius: var(--r-full); object-fit: cover; filter: grayscale(1); }
  .intro__text { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
  h1 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  /* «Cómo hacerlo» es una píldora; al abrirla, la explicación sale en una tarjeta bajo el título, con un despliegue suave. */
  .intro .intro__toggle { all: unset; margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px 0 14px; border: 1px solid var(--border); border-radius: var(--r-full); cursor: pointer; font-size: 13px; font-weight: 500; color: var(--fg-muted); transition: color 200ms var(--ease), border-color 200ms var(--ease), background-color 200ms var(--ease); }
  .intro .intro__toggle:hover { color: var(--fg-strong); border-color: var(--border-strong); }
  .intro.is-open .intro__toggle { color: var(--fg-strong); border-color: var(--border-strong); }
  .intro__toggle svg { transition: transform 200ms var(--ease); }
  .intro.is-open .intro__toggle svg { transform: rotate(180deg); }
  .intro__body { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows 250ms var(--ease), opacity 200ms var(--ease); }
  .intro.is-open .intro__body { grid-template-rows: 1fr; opacity: 1; }
  .intro__body > div { overflow: hidden; }
  /* La explicación es un comentario de quien da la clase: un bocadillo que cuelga de su foto, un punto más claro que la tarjeta. */
  .intro__card { position: relative; max-width: 760px; margin: 12px 0 2px 40px; padding: 14px 18px 16px; border: 1px solid var(--border); border-radius: var(--r-sm) var(--r-lg) var(--r-lg) var(--r-lg); background: rgba(255, 255, 255, 0.035); }
  .intro__card::before { content: ""; position: absolute; left: -28px; top: -14px; width: 27px; height: 32px; border-left: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); border-bottom-left-radius: var(--r-md); }
  .lead { margin: 0; font-size: 15px; line-height: 1.55; color: var(--fg-strong); }
  .help { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 14px; }
  .help li { position: relative; padding-left: 22px; color: var(--fg); }
  .help li::before { content: ""; position: absolute; left: 0; top: 0.8em; width: 10px; height: 1px; background: var(--border-strong); }
  .help a { color: var(--fg-strong); text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .help a:hover { text-decoration-color: var(--fg-strong); }
  .intro + * { margin-top: 28px !important; }
  .intro__notes { margin: 6px 0 2px 40px; max-width: 760px; }
  .intro__notes p { margin: 0; font-size: 13px; line-height: 1.6; color: var(--fg-muted); }
  /* Paso 3: una tarjeta por pregunta, con ChatGPT y el Modo IA lado a lado. */
  .qhead.qhead--top { margin-top: 0; padding-top: 0; border-top: 0; }
  .asks { margin: 0; padding: 0; list-style: none; }
  .asks > li { padding: 18px 0 22px; }
  .asks > li + li { border-top: 1px solid var(--border); }
  .ask__q { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: baseline; }
  .ask__q .n { font: 11px var(--mono); letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.5); }
  .ask__q p { margin: 0; font-size: 15px; line-height: 1.5; color: var(--fg-strong); }
  .ask__engines { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 12px; margin: 14px 0 0 40px; }
  .eng { min-width: 0; padding: 12px; border: 1px solid var(--border); border-radius: var(--r-lg); background: rgba(255, 255, 255, 0.03); }
  .eng__head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .web { display: flex; align-items: center; gap: 6px; padding: 4px 0 4px 2px; }
  .web__d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--fg); text-decoration: none; }
  .web__d:hover { color: var(--fg-strong); text-decoration: underline; }
  .addweb.is-bad { border-color: var(--error); }
  .paths { display: flex; flex-direction: column; margin-top: 4px; }
  .paths a { max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--fg-muted); text-decoration: none; }
  .paths a:hover { color: var(--fg); text-decoration: underline; }
  .web .x { width: 24px; height: 24px; }
  /* Es un textarea para que, al pegar varias webs en líneas distintas, no se junten. */
  .addweb { display: block; width: 100%; min-height: 34px; field-sizing: content; resize: none; margin-top: 6px; padding: 8px 10px; line-height: 1.3; border: 1px dashed var(--border-strong); border-radius: var(--r-md); background: transparent; color: var(--fg-strong); font: 13px var(--mono); }
  .addweb::placeholder { font-family: var(--sans); color: rgba(163, 163, 163, 0.5); }
  .addweb:focus { outline: none; border-style: solid; border-color: var(--fg-muted); }
  @media (max-width: 860px) { .ask__engines { grid-template-columns: 1fr; margin-left: 0; } }
  /* Lista de preguntas del paso 2. */
  /* Es el resultado de todo el paso, no del último punto: va separado de borde a borde, con su propio título. */
  .qhead { display: flex; align-items: center; gap: 10px; margin: 8px -24px 8px; padding: 24px 24px 0; border-top: 1px solid var(--border); }
  .qhead h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .qcount { font: 11px var(--mono); color: var(--fg-muted); padding: 2px 8px; border: 1px solid var(--border); border-radius: var(--r-full); }
  .qactions { margin-left: auto; display: flex; gap: 20px; }
  .qlist { margin: 0; padding: 0; list-style: none; }
  .qlist li { display: grid; grid-template-columns: 28px 1fr 28px; gap: 12px; align-items: start; padding: 12px 0; }
  .qlist li + li { border-top: 1px solid var(--border); }
  .qlist .n { padding-top: 9px; font: 11px var(--mono); letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.5); }
  .qbody { display: flex; flex-direction: column; min-width: 0; }
  .qbody textarea, .qbody input { width: 100%; margin: 0 0 0 -8px; padding: 6px 8px; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; font: inherit; resize: none; transition: border-color 150ms var(--ease); }
  .qbody .q { field-sizing: content; min-height: 34px; font-size: 15px; line-height: 1.5; color: var(--fg-strong); }
  .qbody .o { font: 12px var(--mono); color: var(--fg-muted); }
  .qbody textarea:hover, .qbody input:hover { border-color: var(--border); }
  .qbody textarea:focus, .qbody input:focus { outline: none; border-color: var(--border-strong); }
  .qlist .x { margin-top: 4px; opacity: 0; transition: opacity 150ms var(--ease); }
  .qlist li:hover .x, .qlist .x:focus { opacity: 1; }
  .qempty { margin: 0; padding: 24px 0; color: var(--fg-muted); font-size: 14px; }

  /* Las tablas van un punto más claras que la tarjeta, como el comentario de la cabecera. */
  .table-wrap { border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; background: rgba(255, 255, 255, 0.03); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  thead { border-bottom: 1px solid var(--border); }
  th { height: 40px; padding: 0 16px; text-align: left; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--fg-muted); white-space: nowrap; }
  tbody tr { transition: background-color 200ms var(--ease); }
  tbody tr + tr { border-top: 1px solid var(--border); }
  tbody tr:hover { background: rgba(255, 255, 255, 0.02); }
  td { padding: 6px 8px; vertical-align: top; }
  td.static { padding: 14px 16px; vertical-align: middle; }
  td input, td select, td textarea { width: 100%; padding: 8px; border: 1px solid transparent; border-radius: var(--r-sm); background: transparent; color: var(--fg-strong); font: inherit; resize: vertical; transition: border-color 150ms var(--ease); }
  td input::placeholder, td textarea::placeholder { color: rgba(163, 163, 163, 0.35); }
  td input:focus::placeholder, td textarea:focus::placeholder { color: rgba(163, 163, 163, 0.55); }
  td input:hover, td select:hover, td textarea:hover { border-color: var(--border); }
  /* Al editar, basta con que se marque el borde de la celda. */
  td input:focus, td select:focus, td textarea:focus { outline: none; border-color: var(--border-strong); }
  td textarea { field-sizing: content; min-height: 38px; }
  td select { appearance: none; cursor: pointer; }
  td select option { background: var(--bg); color: var(--fg-strong); }
  td.del { width: 44px; text-align: center; vertical-align: middle; }
  .x { all: unset; cursor: pointer; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: var(--r-full); color: rgba(163, 163, 163, 0.5); transition: color 150ms var(--ease), background-color 150ms var(--ease); }
  .x:hover { color: var(--fg-strong); background: var(--bg); }
  .x svg { width: 14px; height: 14px; }
  .empty td { padding: 32px 16px; text-align: center; color: var(--fg-muted); }

  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn { all: unset; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: var(--r-full); font-size: 13px; font-weight: 500; white-space: nowrap; transition: background-color 200ms var(--ease), color 200ms var(--ease), border-color 200ms var(--ease); }
  .btn--primary { background: var(--fg-strong); color: var(--bg); box-shadow: var(--shadow-key); }
  .btn--primary:hover { background: var(--fg); }
  .btn--secondary { border: 1px solid var(--border); color: var(--fg-muted); }
  .btn--secondary:hover { border-color: var(--border-strong); color: var(--fg); }
  .btn--ghost { color: var(--fg-muted); }
  .btn--ghost:hover { background: var(--bg-elevated); color: var(--fg-strong); }

  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--r-lg); margin: 28px 0 24px; }
  .metric { padding: 22px 24px; }
  .metric + .metric { border-left: 1px solid var(--border); }
  .metric b { display: block; margin-bottom: 6px; font-size: 36px; font-weight: 500; line-height: 1; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .state { display: inline-flex; align-items: center; gap: 8px; color: var(--fg); }
  /* Paso 4: cifras arriba, selector de buscador y la clasificación de webs con su barra de peso. */
  .rank-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
  .rank-cols { display: grid; grid-template-columns: 32px minmax(180px, 340px) 190px minmax(0, 1fr) minmax(140px, 240px) 20px; gap: 16px; padding: 0 4px 8px; font: 11px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(163, 163, 163, 0.6); }
  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--border); border-radius: var(--r-full); }
  .seg button { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 5px 14px; border-radius: var(--r-full); font-size: 13px; color: var(--fg-muted); transition: background-color 150ms var(--ease), color 150ms var(--ease); }
  .seg button:hover { color: var(--fg-strong); }
  .seg button.is-on { background: rgba(255, 255, 255, 0.08); color: var(--fg-strong); }
  .ranking { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  .rank { border-bottom: 1px solid var(--border); }
  .rank__row { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 32px minmax(180px, 340px) 190px minmax(0, 1fr) minmax(140px, 240px) 20px; align-items: center; gap: 16px; padding: 14px 4px; transition: background-color 150ms var(--ease); }
  .rank__row:hover { background: rgba(255, 255, 255, 0.02); }
  .rank__n { font: 11px var(--mono); letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.5); }
  .rank__web { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .rank__web > span { min-width: 0; }
  .rank__web b { font-weight: 500; font-size: 15px; color: var(--fg-strong); }
  .rank__web b, .rank__web small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank__web small { display: block; margin-top: 2px; font-size: 12px; color: var(--fg-muted); }
  .fav { flex: none; width: 20px; height: 20px; border-radius: var(--r-sm); background: rgba(255, 255, 255, 0.06); }
  /* La barra y el número van juntos: en cuántas de tus preguntas sale la web. */
  .rank__q { display: flex; align-items: center; gap: 12px; padding-left: 24px; }
  .rank-cols span:nth-child(5) { padding-left: 24px; }
  .rank__bar { flex: 1; height: 6px; border-radius: var(--r-full); background: rgba(255, 255, 255, 0.06); overflow: hidden; }
  .rank__bar span { display: block; height: 100%; border-radius: inherit; background: var(--fg); }
  .rank__eng { display: flex; gap: 6px; }
  .eng-tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-full); font-size: 11px; color: var(--fg-muted); white-space: nowrap; }
  .eng-tag b { font-weight: 500; color: var(--fg); }
  .rank__c { flex: none; min-width: 52px; text-align: right; font: 500 13px var(--mono); color: var(--fg-strong); font-variant-numeric: tabular-nums; }
  .rank__chev { display: grid; place-items: center; color: var(--fg-muted); transition: transform 200ms var(--ease); }
  .rank.is-open .rank__chev { transform: rotate(180deg); }
  .eng-ico { width: 12px; height: 12px; flex: none; color: var(--fg); }
  .rank__more { display: none; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin: 0 4px 16px 48px; padding: 16px 18px; border: 1px solid var(--border); border-radius: var(--r-lg); background: rgba(255, 255, 255, 0.03); }
  .rank.is-open .rank__more { display: grid; }
  .rank__more ul { margin: 10px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .rank__more li { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
  .rank__more li span { flex: none; display: inline-flex; gap: 4px; }
  .rank__more a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--fg); text-decoration: none; }
  .rank__more a:hover { color: var(--fg-strong); text-decoration: underline; }
  .rank__more p { margin: 0; min-width: 0; font-size: 13px; line-height: 1.45; color: var(--fg); }
  .rank--mine { opacity: 0.6; }
  @media (max-width: 860px) { .qhead { margin-left: -16px; margin-right: -16px; padding-left: 16px; padding-right: 16px; flex-wrap: wrap; } .qactions { gap: 14px; } .rank__row { grid-template-columns: 28px minmax(0, 1fr) 0 64px 20px; } .rank__bar, .rank__eng, .rank-cols { display: none; } .rank__more { grid-template-columns: 1fr; margin-left: 4px; } }
  .prompt { margin: 0 0 28px; border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; }
  .prompt__head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; padding: 18px 20px; border-bottom: 1px solid var(--border); }
  .prompt__head strong { display: block; margin-top: 6px; font-size: 16px; font-weight: 500; color: var(--fg-strong); }
  .prompt__head p { margin: 4px 0 0; font-size: 13px; color: var(--fg-muted); }
  .prompt pre { margin: 0; padding: 18px 20px; max-height: 168px; overflow: auto; background: var(--bg); font: 13px/1.6 var(--mono); color: var(--fg); white-space: pre-wrap; }
  .prompt-step { margin: 28px 0 10px; }
  .note { margin-top: 14px; font-size: 13px; color: var(--fg-muted); }
  /* Paso 2 guiado: una línea de tiempo discreta, sin cajas; cada punto lleva su número y se vuelve un check al marcarlo. */
  .guide { margin: 0 0 36px; padding: 0; list-style: none; }
  .guide > li { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 16px; padding-bottom: 28px; }
  .guide > li:last-child { padding-bottom: 0; }
  .guide > li:not(:last-child)::before { content: ""; position: absolute; left: 11.5px; top: 30px; bottom: 6px; width: 1px; background: var(--border); }
  .check { all: unset; box-sizing: border-box; width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid var(--border-strong); border-radius: var(--r-full); cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--fg-muted); transition: background-color 200ms var(--ease), border-color 200ms var(--ease), color 200ms var(--ease); }
  .check:hover { border-color: var(--fg-muted); color: var(--fg-strong); }
  .check svg { display: none; width: 12px; height: 12px; }
  .is-done .check { background: var(--success); border-color: var(--success); color: var(--bg); }
  .is-done .check svg { display: block; }
  .is-done .check span { display: none; }
  .guide h3 { margin: 2px 0 0; font-size: 15px; font-weight: 500; color: var(--fg-strong); transition: color 200ms var(--ease); }
  .is-done h3 { color: var(--fg-muted); }
  .guide .sub { margin: 4px 0 0; font-size: 14px; color: var(--fg-muted); }
  .guide .do { margin-top: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .btn--sm { height: 30px; padding: 0 14px; font-size: 13px; text-decoration: none; }
  .link { all: unset; cursor: pointer; font-size: 13px; color: var(--fg-muted); transition: color 150ms var(--ease); }
  .link:hover { color: var(--fg-strong); }
  /* La URL va en una píldora con su acción de copiar como texto, sin botón. */
  .chip { display: inline-flex; align-items: center; gap: 14px; max-width: 100%; height: 34px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--r-full); }
  .chip code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 13px var(--mono); color: var(--fg); }
  /* Paso 1: un formulario corto, un dato por fila. */
  .form { max-width: 560px; display: grid; gap: 20px; }
  .form label { display: flex; flex-direction: column; gap: 8px; }
  .form input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--border); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.03); color: var(--fg-strong); font: 15px var(--sans); transition: border-color 150ms var(--ease); }
  .form input::placeholder { color: rgba(163, 163, 163, 0.35); }
  .form input:hover { border-color: var(--border-strong); }
  .form input:focus { outline: none; border-color: var(--fg-muted); }
  .form small { font-size: 13px; color: var(--fg-muted); }
  /* El prompt relleno: un bloque de texto tenue, sin fondo propio, con su acción debajo. */
  .filled { align-self: stretch; max-width: 820px; border: 1px solid var(--border); border-radius: var(--r-lg); }
  .filled pre { margin: 0; padding: 16px 18px; max-height: 168px; overflow: auto; font: 12.5px/1.7 var(--mono); color: var(--fg-muted); white-space: pre-wrap; }
  .filled mark { background: none; color: var(--fg-strong); }
  .filled mark.empty { color: var(--error); }
  .filled-foot { display: flex; align-items: center; gap: 12px; padding: 10px; border-top: 1px solid var(--border); font-size: 13px; color: var(--fg-muted); }
  /* Pie siempre abajo: al final de la tarjeta si cabe todo, y pegado al borde inferior al hacer scroll. */
  .spacer { flex: 1 0 48px; }
  footer.credit { position: sticky; bottom: 0; margin: 0 -24px; padding: 16px 24px 18px; border-radius: 0 0 var(--r-lg) var(--r-lg); border-top: 1px solid var(--border); background: var(--bg-elevated); display: flex; justify-content: space-between; }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); } aside { position: static; height: auto; } .side-foot { margin-top: 20px; } footer.credit { flex-direction: column; gap: 6px; } .rank-head { flex-wrap: wrap; } .seg button { white-space: nowrap; }
    main { margin: 0 8px 8px; padding: 0 16px; } footer.credit, .intro { margin: 0 -16px; padding: 16px; } .intro__card { margin-left: 0; } .metrics { grid-template-columns: 1fr; } .metric + .metric { border-left: 0; border-top: 1px solid var(--border); }
  }

<script>
const KEY = 'geo-primeros-pasos/donde-deberias-estar'

const STEPS = [
  {
    id: 'productos', title: 'Qué quieres potenciar', short: 'A potenciar',
    cols: [
      { k: 'nombre', label: 'Producto o servicio', ph: 'Por ejemplo, hosting WordPress', tag: '[PRODUCTO O SERVICIO]' },
      { k: 'url', label: 'URL de su página', ph: 'https://tuweb.com/hosting-wordpress', url: true, hint: 'La que filtrarás en Search Console.' },
      { k: 'cliente', label: 'A quién se lo vendes', ph: 'Por ejemplo, agencias pequeñas', tag: '[TIPO DE CLIENTE]' },
      { k: 'lugar', label: 'Dónde', ph: 'Por ejemplo, España o Madrid', tag: '[PAÍS O CIUDAD]', hint: 'País o ciudad.' },
    ],
    form: true,
  },
  {
    id: 'preguntas', title: 'Saca las preguntas de tu cliente', short: 'Preguntas',
    cols: [{ k: 'pregunta', label: 'Pregunta', area: true }, { k: 'origen', label: 'Consulta de origen' }],
    importable: true, guide: true,
  },
  {
    id: 'fuentes', title: 'Haz las preguntas y apunta las fuentes', short: 'Webs citadas',
    cols: [{ k: 'pregunta', label: 'Pregunta' }, { k: 'buscador', label: 'Dónde' }, { k: 'url', label: 'URL citada' }, { k: 'web', label: 'Web' }],
    help: ['En una ventana privada, sin iniciar sesión.', 'Pega la URL de cada fuente. Si una web sale varias veces, apunta solo su página más relevante.', 'Apunta solo las webs donde podrías aparecer: ni las de tu competencia ni las imposibles, como un vídeo ya publicado.'],
    ask: true,
  },
]

// Los mismos prompts que prompts.md, para copiarlos sin salir de aquí.
const PROMPTS = [
  { id: 'p1', step: 'preguntas', title: 'Sacar las preguntas de tu cliente', how: 'Adjunta el archivo de Consultas de Search Console y pega este prompt.', text: `Te adjunto las consultas de Google Search Console de la página de [PRODUCTO O SERVICIO] de mi web, [WEB]. Vendo a [TIPO DE CLIENTE] en [PAÍS O CIUDAD].

Con esas consultas, escribe las preguntas que una persona así le haría a ChatGPT sobre [PRODUCTO O SERVICIO]. En lenguaje natural y en primera persona, como las escribiría alguien real.

Reglas:
- Usa solo consultas del archivo. No te inventes temas.
- Escribe preguntas de quien quiere entender, comparar o resolver algo: qué es, cómo elegir, en qué fijarse, diferencias, cuánto cuesta, ventajas e inconvenientes.
- No pidas que te recomiende una marca o un proveedor (nada de «¿cuál me recomiendas?» o «¿cuál es el mejor?»): convierte esas consultas en preguntas sobre cómo elegir. Así la IA cita guías, comparativas, medios y foros, y no las webs de las propias marcas.
- Ignora las consultas con el nombre de mi marca, la de [WEB], aunque esté mal escrito. Si una consulta nombra a otras marcas, pregunta en qué se diferencian, sin pedir que elija una.
- Junta en una sola pregunta las consultas que signifiquen lo mismo.
- Una sola pregunta por fila.
- Añade solo el contexto que se deduce de la consulta o de a quién vendo. No inventes datos que no estén ahí, como cifras, nombres o situaciones personales.
- Si la respuesta puede cambiar según el país o la ciudad, menciona [PAÍS O CIUDAD] en la pregunta, como lo haría alguien de allí.
- Ordénalas de la más importante a la menos importante según los clics y las impresiones de sus consultas.

Devuélveme solo un CSV separado por punto y coma, con esta cabecera exacta:
Pregunta;Consulta de origen` },
]

const blank = () => ({ ...Object.fromEntries(STEPS.map((s) => [s.id, []])), checks: {} })
const load = () => { try { return { ...blank(), ...JSON.parse(localStorage.getItem(KEY)) } } catch { return blank() } }
let data = load()
// Se puede entrar directamente a una vista desde un enlace: seguimiento.html#prompts
let view = ['tareas', ...STEPS.map((s) => s.id)].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'productos'
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)) } catch {} }

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const domain = (s) => String(s || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0]

// Lista final: una fila por web citada, con sus páginas, de la que más se repite a la que menos. Tu propia web se marca sola.
const tasks = (engine) => {
  const by = new Map()
  const mine = domain(product().url)
  for (const r of data.fuentes) {
    const d = domain(r.web)
    if (!d || (engine && r.buscador !== engine)) continue
    const t = by.get(d) || { web: d, veces: 0, urls: new Map(), preguntas: new Set(), engines: {}, tu: !!mine && d === mine }
    t.veces++
    t.preguntas.add(r.pregunta)
    t.qeng = t.qeng || new Map()
    t.qeng.set(r.pregunta, new Set([...(t.qeng.get(r.pregunta) || []), r.buscador]))
    t.engines[r.buscador] = (t.engines[r.buscador] || 0) + 1
    if (r.url) {
      const u = t.urls.get(r.url) || { url: r.url, veces: 0, engines: new Set() }
      u.veces++
      u.engines.add(r.buscador)
      t.urls.set(r.url, u)
    }
    by.set(d, t)
  }
  return [...by.values()].map((t) => ({ ...t, urls: [...t.urls.values()].sort((a, b) => b.veces - a.veces) }))
    .sort((a, b) => a.tu - b.tu || b.preguntas.size - a.preguntas.size || b.veces - a.veces)
}

const pad = (n) => String(n).padStart(2, '0')
const X = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'

// Cada paso se abre cuando el anterior tiene lo que necesita; la lista final y el análisis, cuando hay webs citadas.
const isDone = (id) => id === 'productos' ? STEPS[0].cols.every((c) => (product()[c.k] || '').trim())
  : id === 'fuentes' ? data.fuentes.some((r) => domain(r.web)) : data[id].length > 0
const isOpen = (id) => {
  if (id === 'tareas') return isDone('fuentes')
  const i = STEPS.findIndex((s) => s.id === id)
  return i <= 0 || isDone(STEPS[i - 1].id)
}
const firstOpen = () => [...STEPS].reverse().find((s) => isOpen(s.id))?.id || 'productos'
const lockedTitle = (id) => id === 'tareas' ? 'Se abre cuando apuntes webs citadas en el paso 3' : `Completa antes el paso ${STEPS.findIndex((s) => s.id === id)}`

const LOCK = '<svg class="lock" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'

function renderNav() {
  const nav = document.getElementById('nav')
  const pending = tasks().filter((t) => !t.tu).length
  nav.innerHTML = STEPS.map((s, i) => `
    <button class="nav ${view === s.id ? 'is-on' : ''} ${isOpen(s.id) ? '' : 'is-locked'}" data-v="${s.id}" ${isOpen(s.id) ? '' : `title="${lockedTitle(s.id)}"`}>
      <span class="n">${pad(i + 1)}</span><span>${s.short}</span>
      <span class="c">${!isOpen(s.id) ? LOCK : s.form ? (isDone(s.id) ? '<span class="dot dot--success"></span>' : '') : data[s.id].length ? `${data[s.id].length}<span class="dot dot--success"></span>` : ''}</span>
    </button>`).join('') + `
    <button class="nav ${view === 'tareas' ? 'is-on' : ''} ${isOpen('tareas') ? '' : 'is-locked'}" data-v="tareas" ${isOpen('tareas') ? '' : `title="${lockedTitle('tareas')}"`}>
      <span class="n">${pad(STEPS.length + 1)}</span><span>Dónde deberías estar</span><span class="c">${!isOpen('tareas') ? LOCK : pending ? `${pending}<span class="dot dot--success"></span>` : ''}</span>
    </button>`
  nav.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => { if (isOpen(b.dataset.v)) { view = b.dataset.v; render() } })
}

const INTRO_KEY = 'geo-primeros-pasos/intro-plegada'
let introClosed = (() => { try { return localStorage.getItem(INTRO_KEY) === '1' } catch { return false } })()
const CHEVRON = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>'
// Plegada, la cabecera solo enseña la foto y el título; al desplegarla salen la entradilla y cómo hacerlo.
// Sin lead, la cabecera es solo la foto y el título (el paso 1, que se entiende solo).
const intro = (title, lead, items = []) => `
  <header class="intro ${lead && !introClosed ? 'is-open' : ''}">
    <div class="intro__row">
      <img src="${AUTHOR.photo}" alt="${AUTHOR.name}">
      <div class="intro__text"><h1>${title}</h1></div>
      ${lead ? `<button class="intro__toggle" id="intro-toggle">Cómo hacerlo ${CHEVRON}</button>` : ''}
    </div>
    ${lead ? `<div class="intro__body"><div><div class="intro__card">
      <p class="lead">${lead}</p>
      ${items.length ? `<ul class="help">${items.map((h) => `<li>${h}</li>`).join('')}</ul>` : ''}
    </div></div></div>` : ''}
  </header>`
// Cabecera con las indicaciones siempre a la vista, en texto discreto bajo el título, sin bocadillo ni botón para plegar.
const introPlain = (title, lines = []) => `
  <header class="intro intro--plain">
    <div class="intro__row"><img src="${AUTHOR.photo}" alt="${AUTHOR.name}"><div class="intro__text"><h1>${title}</h1></div></div>
    ${lines.length ? `<div class="intro__notes">${lines.map((l) => `<p>${l}</p>`).join('')}</div>` : ''}
  </header>`
function wireIntro(root) {
  const b = root.querySelector('#intro-toggle')
  if (b) b.onclick = () => {
    introClosed = !introClosed
    try { localStorage.setItem(INTRO_KEY, introClosed ? '1' : '0') } catch {}
    root.querySelector('.intro').classList.toggle('is-open', !introClosed)
  }
}
const credit = `<div class="spacer"></div><footer class="credit"><span class="mono">#RaiolaWebinar</span><span class="mono">Se guarda solo en este navegador</span></footer>`

function cell(step, col, row, i) {
  const v = row[col.k] ?? ''
  const attrs = `data-i="${i}" data-k="${col.k}"`
  let opts = col.opts
  if (col.from) {
    const src = data[col.from].map((r) => (col.field ? r[col.field] : r.nombre)).map((x) => (col.from === 'fuentes' && col.field === 'web' ? domain(x) : x)).filter(Boolean)
    opts = ['', ...new Set(src)]
    if (v && !opts.includes(v)) opts.push(v)
  }
  if (opts) return `<select ${attrs}>${opts.map((o) => `<option ${o === v ? 'selected' : ''} value="${esc(o)}">${esc(o || '—')}</option>`).join('')}</select>`
  if (col.area) return `<textarea rows="${Math.max(1, Math.ceil(String(v).length / 42))}" ${attrs}>${esc(v)}</textarea>`
  const ph = col.ph ? `placeholder="${esc(col.ph)}"` : ''
  return `<input ${attrs} value="${esc(v)}" ${ph} ${col.num ? 'inputmode="numeric"' : ''} ${col.date ? 'type="date"' : ''} ${col.url ? 'type="url" spellcheck="false"' : ''}>`
}

const promptCard = (p) => `
  <div class="prompt">
    <div class="prompt__head"><div><span class="mono">Prompt</span><strong>${p.title}</strong><p>${p.how} Cambia lo que va entre corchetes.</p></div>
      <button class="btn btn--primary" data-copy="${p.id}">Copiar prompt</button></div>
    <pre>${esc(p.text)}</pre>
  </div>`

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true } catch {
    const t = document.createElement('textarea')
    t.value = text
    document.body.appendChild(t)
    t.select()
    const ok = document.execCommand('copy')
    t.remove()
    return ok
  }
}
function wireCopy(root) {
  root.querySelectorAll('[data-copy]').forEach((b) => b.onclick = async () => {
    const ok = await copyText(PROMPTS.find((p) => p.id === b.dataset.copy).text)
    b.textContent = ok ? 'Copiado' : 'No se ha podido copiar'
    setTimeout(() => (b.textContent = 'Copiar prompt'), 1800)
  })
}

// Paso 3, pregunta a pregunta: cada pregunta se abre ya enviada en ChatGPT y en el Modo IA, y debajo se apuntan las webs
// que cita cada uno. Las filas siguen siendo las de data.fuentes, así que la lista final no cambia.
const ENGINES = [
  { k: 'ChatGPT', url: (q) => `https://chatgpt.com/?q=${encodeURIComponent(q)}&hints=search` },
  { k: 'Modo IA', url: (q) => `https://www.google.com/search?udm=50&q=${encodeURIComponent(q)}` },
]
// La URL tal como se copia del enlace, sin las marcas de seguimiento que añaden los buscadores (utm_…, #:~:text=…).
const cleanUrl = (x) => {
  try {
    const u = new URL(/^https?:\/\//i.test(x) ? x : `https://${x}`)
    // Un enlace de Google (el que se copia en el Modo IA) no es la fuente: hay que abrirla y copiar su dirección.
    if (!u.hostname.includes('.') || /(^|\.)google\./.test(u.hostname)) return ''
    ;[...u.searchParams.keys()].filter((k) => /^utm_/i.test(k)).forEach((k) => u.searchParams.delete(k))
    u.hash = ''
    return u.toString().replace(/\/$/, '')
  } catch { return '' }
}
const webs = (q, e) => data.fuentes.map((r, i) => ({ ...r, i })).filter((r) => r.pregunta === q && r.buscador === e)
const asked = (q) => ENGINES.every((e) => webs(q, e.k).length)

function renderAsk(step) {

              <div class="web">

                <button class="x" data-delweb="${w.i}" title="Quitar">${X}</button>
              </div>`).join('')}
            <textarea class="addweb" rows="1" data-q="${qi}" data-e="${e.k}" placeholder="Pega la URL de cada fuente y pulsa Intro" spellcheck="false"></textarea>

function wireAsk(main) {
  const qs = data.preguntas.map((r) => (r.pregunta || '').trim()).filter(Boolean)
  const refocus = (qi, e) => main.querySelector(`.addweb[data-q="${qi}"][data-e="${e}"]`)?.focus()
  const add = (el) => {
    // Una URL por línea o separadas por espacios o comas. Lo que no es una dirección (un nombre suelto) no entra.
    const parts = el.value.split(/[\s,;]+/).filter(Boolean)
    const found = [...new Set(parts.map(cleanUrl).filter(Boolean))]
    const bad = parts.length - parts.filter((x) => cleanUrl(x)).length
    const q = qs[+el.dataset.q], e = el.dataset.e
    const have = webs(q, e).map((w) => w.url)
    for (const u of found) if (!have.includes(u)) data.fuentes.push({ pregunta: q, buscador: e, url: u, web: domain(u) })
    if (found.length) { save(); render() }
    const box = main.querySelector(`.addweb[data-q="${el.dataset.q}"][data-e="${e}"]`)
    if (bad) { box.value = parts.filter((x) => !cleanUrl(x)).join('\n'); box.classList.add('is-bad'); box.title = 'Esto no es la URL de la fuente. En el Modo IA, abre la fuente y copia la dirección de la barra del navegador.' }
    box.focus()
  }
  main.querySelectorAll('.addweb').forEach((el) => {
    el.onkeydown = (ev) => { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); add(el) } }
    el.onpaste = () => setTimeout(() => add(el))
    el.oninput = () => el.classList.remove('is-bad')
  })
  main.querySelectorAll('[data-delweb]').forEach((b) => b.onclick = () => { data.fuentes.splice(+b.dataset.delweb, 1); save(); render() })
}

function toCSV(cols, rows) {
  const q = (s) => `"${String(s ?? '').replace(/"/g, '""')}"`
  return '﻿' + [cols.map((c) => q(c.label)).join(';'), ...rows.map((r) => cols.map((c) => q(r[c.k])).join(';'))].join('\n')
}
function download(name, text, type = 'text/csv') {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(new Blob([text], { type }))
  a.download = name
  a.click()
  setTimeout(() => URL.revokeObjectURL(a.href), 1000)
}

// Lee un CSV separado por punto y coma o por comas, con comillas, como los que devuelven las IA y Excel. Acepta también
// lo que se copia de un chat: quita las líneas de bloque de código (```) y convierte una tabla en Markdown.
function parseCSV(text) {
  text = text.replace(/^﻿/, '').split(/\r?\n/)
    .filter((l) => !/^\s*```/.test(l) && !/^\s*\|?\s*:?-{3,}/.test(l))
    .map((l) => /^\s*\|.*\|\s*$/.test(l) ? l.trim().slice(1, -1).split('|').map((c) => c.trim()).join(';') : l)
    .join('\n').trim()
  // Se pide punto y coma; si no aparece en ninguna línea, el CSV va con comas.
  const sep = text.includes(';') ? ';' : ','
  const rows = [[]]
  let cur = '', q = false
  for (let i = 0; i < text.length; i++) {
    const ch = text[i]
    if (q) {
      if (ch === '"' && text[i + 1] === '"') { cur += '"'; i++ }
      else if (ch === '"') q = false
      else cur += ch
    } else if (ch === '"') q = true
    else if (ch === sep) { rows.at(-1).push(cur); cur = '' }
    else if (ch === '\n') { rows.at(-1).push(cur); rows.push([]); cur = '' }
    else if (ch !== '\r') cur += ch
  }
  rows.at(-1).push(cur)
  return rows.filter((r) => r.some((c) => c.trim()))
}
const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ¿?¡!]/g, '').trim()
// Empareja las columnas del CSV con las de la tabla por su nombre, sin tildes ni mayúsculas.
// La cabecera es la primera fila que tiene alguna de las columnas: lo que la IA escriba antes se ignora.
function fromCSV(cols, rows) {
  const at = rows.findIndex((r) => r.some((h) => cols.some((c) => [norm(c.label), norm(c.k)].includes(norm(h)))))
  if (at < 0) return []
  const [head, ...body] = rows.slice(at)
  const map = cols.map((c) => head.findIndex((h) => [norm(c.label), norm(c.k)].includes(norm(h))))
  // Una línea suelta sin separador (lo que la IA añada después, como «¿Quieres más?») no es una fila.
  return body.filter((r) => head.length < 2 || r.length > 1).map((r) => Object.fromEntries(cols.map((c, j) => [c.k, map[j] < 0 ? '' : (r[map[j]] || '').trim()])))
}
function pickCSV(done) {
  const input = document.createElement('input')
  input.type = 'file'
  input.accept = '.csv,text/csv,text/plain'
  input.onchange = async () => { const f = input.files[0]; if (f) done(parseCSV(await f.text())) }
  input.click()
}

  if (!isOpen(view)) view = firstOpen()
  renderNav()
  const main = document.getElementById('main')
  const i = STEPS.findIndex((s) => s.id === view)
  if (i < 0) {
    main.innerHTML = renderTasks()
    wireIntro(main)
    wireTasks(main)
    return
  }
  const step = STEPS[i]
  main.innerHTML = renderStep(step, i)
  if (step.ask) {
    wireIntro(main)
    wireAsk(main)
    const c = document.getElementById('csv')
    if (c) c.onclick = () => download(`paso-${i + 1}-${step.id}.csv`, toCSV(step.cols, data[step.id]))
    return
  }
  if (step.form) {
    wireIntro(main)
    main.querySelectorAll('[data-f]').forEach((el) => el.oninput = () => {
      data.productos[0] = { ...product(), [el.dataset.f]: el.value }
      save()
      renderNav()
    })
    return
  }
  main.querySelectorAll('[data-k]').forEach((el) => {
    el.oninput = el.onchange = () => { data[step.id][+el.dataset.i][el.dataset.k] = el.value; save(); renderNav() }
  })
  main.querySelectorAll('[data-del]').forEach((b) => b.onclick = () => { data[step.id].splice(+b.dataset.del, 1); save(); render() })
  document.getElementById('add').onclick = () => {
    data[step.id].push({})
    save()
    render()
    const inputs = main.querySelectorAll('tbody tr:last-child [data-k], .qlist li:last-child [data-k]')
    inputs[0]?.focus()
  }
  wireCopy(main)
  wireIntro(main)
  if (step.guide) wireGuide(main)
  main.querySelectorAll('[data-import]').forEach((imp) => imp.onclick = () => pickCSV((rows) => {
    const added = fromCSV(step.cols, rows)
    if (!added.length) { alert('No he encontrado columnas que encajen. La primera fila del CSV tiene que ser la cabecera: ' + step.cols.map((c) => c.label).join(';')); return }
    data[step.id].push(...added)
    // Importar es el último punto de la lista del paso 2: se marca solo.
    if (step.guide) { const list = data.checks.preguntas ||= []; if (!list.includes(4)) list.push(4) }
    save()
    render()
  }))
  const csv = document.getElementById('csv')
  if (csv) csv.onclick = () => download(`paso-${i + 1}-${step.id}.csv`, toCSV(step.cols, data[step.id]))
}

document.getElementById('export-json').onclick = () => download(`donde-deberias-estar-${domain(product().url) || 'trabajo'}.json`, JSON.stringify(data, null, 2), 'application/json')
document.getElementById('import-json').onclick = () => document.getElementById('file').click()
document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0]
  if (!f) return
  try { data = { ...blank(), ...JSON.parse(await f.text()) }; save(); render() } catch { alert('Ese archivo no es un trabajo guardado con esta herramienta.') }
  e.target.value = ''
}
document.getElementById('reset').onclick = () => {
  if (!confirm('¿Empezar con otra URL? Se borra todo lo apuntado. Si quieres conservarlo, cancela y pulsa antes «Descargar mi trabajo».')) return
  data = blank(); save(); view = 'productos'; render()
}

render()
</script>
</body>
</html>
