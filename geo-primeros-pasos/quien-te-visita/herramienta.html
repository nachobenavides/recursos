<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="../../favicon-192.png">
<link rel="apple-touch-icon" href="../../apple-touch-icon.png">
<title>¿Quién te visita? · Microherramienta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b; --bg-elevated: #111111; --border: #2b2b2b; --border-strong: #404040;
    --fg: #d4d4d4; --fg-muted: #a3a3a3; --fg-strong: #f5f5f5;
    --success: #10b981; --error: #ef4444; --info: #60a5fa; --warning: #f59e0b;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
    --tracking-eyebrow: 0.18em; --tracking-tightest: -0.025em;
    --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
    --shadow-key: 0 1px 0 rgba(255, 255, 255, 0.18);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fg-strong); text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--fg-strong); }
  code { font: 12.5px var(--mono); color: var(--fg-strong); }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--fg-muted); }

  /* La misma carcasa que «Dónde deberías estar»: menú a la izquierda y el contenido en una tarjeta. */
  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 16px 24px; }
  .side-brand { display: inline-flex; align-items: center; gap: 8px; margin: 0 12px 28px; color: var(--fg-muted); text-decoration: none; font-size: 13px; }
  .side-brand img { width: 22px; height: 22px; object-fit: contain; }
  .side-brand:hover { color: var(--fg-strong); }
  .side-title { padding: 0 12px 10px; }
  .nav { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: var(--r-md); cursor: pointer; font-size: 14px; color: var(--fg-muted); transition: background-color 200ms var(--ease), color 200ms var(--ease); }
  .nav:hover { color: var(--fg-strong); background: rgba(17, 17, 17, 0.6); }
  .nav .n { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.4); }
  .nav.is-locked { opacity: 0.35; cursor: not-allowed; }
  .nav.is-locked:hover { color: var(--fg-muted); background: none; }
  .nav .c { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot--success { background: var(--success); }
  .dot--error { background: var(--error); }
  .dot--faint { background: rgba(163, 163, 163, 0.35); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }

  main { display: flex; flex-direction: column; margin: 8px 8px 8px 0; min-height: calc(100vh - 16px); padding: 0 24px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-elevated); }
  .intro { margin: 0 -24px; padding: 16px 24px; border-bottom: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .intro__row { display: flex; align-items: center; gap: 14px; }
  .intro__row img { flex: none; width: 26px; height: 26px; border-radius: var(--r-full); object-fit: cover; filter: grayscale(1); }
  h1 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }

  .spacer { flex: 1 0 48px; }
  footer.credit { position: sticky; bottom: 0; margin: 0 -24px; padding: 16px 24px 18px; border-radius: 0 0 var(--r-lg) var(--r-lg); border-top: 1px solid var(--border); background: var(--bg-elevated); display: flex; justify-content: space-between; }
  footer.credit { align-items: center; }
  .credit__sig { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
  .credit__sig img { width: 18px; height: 18px; object-fit: contain; opacity: 0.85; }
  .credit__sig strong { font-weight: 500; color: var(--fg); }
  .credit__sig:hover strong, .credit__talk:hover { color: var(--fg-strong); }
  .credit__talk { text-decoration: none; }

  /* Entrada: un área para soltar o elegir los archivos de logs. */
  form { margin-top: 28px; max-width: 760px; display: grid; gap: 10px; }
  .drop { position: relative; display: grid; place-items: center; gap: 6px; min-height: 180px; padding: 24px; border: 1px dashed var(--border-strong); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.03); text-align: center; cursor: pointer; transition: border-color 150ms var(--ease), background-color 150ms var(--ease); }
  .drop:hover, .drop.is-over { border-color: var(--fg-muted); background: rgba(255, 255, 255, 0.05); }
  .drop input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .drop strong { font-weight: 500; color: var(--fg-strong); }
  .drop span { font-size: 13px; color: var(--fg-muted); }
  form small { font-size: 13px; color: var(--fg-muted); }
  .msg { margin: 0; font-size: 13px; color: var(--fg-muted); }
  .msg.is-bad { color: var(--error); }

  /* Resultado */
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: var(--r-lg); margin-top: 32px; }
  .metric { padding: 20px 22px; }
  .metric + .metric { border-left: 1px solid var(--border); }
  .metric b { display: block; margin-bottom: 6px; font-size: 32px; font-weight: 500; line-height: 1; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .metric span { font-size: 13px; color: var(--fg-muted); }
  .metric b small { font-size: 15px; font-weight: 400; letter-spacing: 0; color: var(--fg-muted); }
  .metric.is-bad b { color: #fca5a5; }
  .period { margin: 10px 0 0; font: 12px var(--mono); color: var(--fg-muted); }
  .kind { margin-top: 32px; scroll-margin-top: 16px; }
  .kind h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .kind__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 14px; }
  .kind__head p { margin: 2px 0 0; font-size: 13px; color: var(--fg-muted); }
  .kind__sum { display: flex; gap: 16px; flex: none; margin: 0; font-size: 13px; color: var(--fg-muted); }
  .kind__sum .is-bad { display: inline-flex; align-items: center; gap: 8px; color: #fca5a5; }
  /* Filas: una columna por dato, con su cabecera, como el ranking de «Dónde deberías estar». */
  .cols, .bot__row { display: grid; grid-template-columns: 190px minmax(160px, 1fr) 150px 72px 80px 72px 16px; gap: 24px; align-items: center; }
  .cols { padding: 0 8px 8px; font-size: 12px; color: var(--fg-muted); }
  .cols .r, .bot__n { text-align: right; }
  .bots { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  .bot { border-bottom: 1px solid var(--border); }
  .bot__row { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 190px minmax(160px, 1fr) 150px 72px 80px 72px 16px; gap: 24px; align-items: center; padding: 14px 8px; }
  .bot__row:hover { background: rgba(255, 255, 255, 0.02); }
  .bot__token { font: 13px var(--mono); color: var(--fg-strong); overflow-wrap: anywhere; }
  .bot__who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted); min-width: 0; }
  .bot__logo { flex: none; width: 18px; height: 18px; object-fit: contain; }
  .bot__n { font: 13px var(--mono); color: var(--fg); }
  .bot__n.is-bad { color: #fca5a5; }
  .bot__n.is-none { color: rgba(163, 163, 163, 0.4); }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-strong); }
  .chev { color: var(--fg-muted); transition: transform 200ms var(--ease); }
  .bot.is-open .chev { transform: rotate(180deg); }
  /* Desplegable: respuestas y páginas, lado a lado, en una tarjeta bajo la fila. */
  .bot__more { display: none; margin: 0 8px 16px; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.02); }
  .bot.is-open .bot__more { display: block; }
  .facts { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 14px 28px; margin: 0; font-size: 13px; }
  .facts dt { color: var(--fg-muted); }
  .facts dd { margin: 0; min-width: 0; color: var(--fg); }
  .facts dd a { color: var(--fg-strong); }
  .codes { display: flex; flex-wrap: wrap; gap: 6px; }
  .code { display: inline-flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-full); font: 12px var(--mono); color: var(--fg-muted); }
  .code i { font-style: normal; }
  .code.is-ok i { color: var(--success); }
  .code.is-redir i { color: #93c5fd; }
  .code.is-gone i { color: #fcd34d; }
  .code.is-bad { border-color: color-mix(in srgb, var(--error) 45%, transparent); }
  .code.is-bad i { color: #fca5a5; }
  button.code { all: unset; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; height: 22px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-full); font: 12px var(--mono); color: var(--fg-muted); cursor: pointer; transition: border-color 150ms var(--ease), opacity 150ms var(--ease); }
  button.code.is-bad { border-color: color-mix(in srgb, var(--error) 45%, transparent); }
  button.code:hover { border-color: var(--fg-muted); }
  button.code.is-active { border-color: var(--fg-strong); color: var(--fg-strong); }
  button.code.is-dim { opacity: 0.45; }
  .hint { display: block; margin-top: 8px; font-size: 12px; color: var(--fg-muted); }
  .ptable { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; }
  .ptable__head, .ptable__row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto) 56px 64px; gap: 20px; align-items: center; padding: 8px 12px; }
  .ptable__head { font-size: 12px; color: var(--fg-muted); border-bottom: 1px solid var(--border); }
  .ptable__head span:nth-child(n+3), .ptable__n, .ptable__d { text-align: right; }
  .ptable__d { font: 12px var(--mono); color: var(--fg-muted); }
  .ptable__row + .ptable__row { border-top: 1px solid var(--border); }
  .ptable__row.is-bad { box-shadow: inset 2px 0 0 var(--error); }
  .ptable__path { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 12px var(--mono); color: var(--fg); }
  .ptable__n { font: 12px var(--mono); color: var(--fg); }
  .ptable__more { margin: 0; padding: 8px 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--fg-muted); }
  .linkbtn { all: unset; cursor: pointer; margin-left: 6px; color: var(--fg-strong); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .linkbtn:hover { text-decoration-color: var(--fg-strong); }
  .warn { margin: 16px 0 0; max-width: 760px; font-size: 13px; color: var(--fg-muted); }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); } aside { position: static; height: auto; padding-bottom: 12px; } .side-foot { margin-top: 20px; }
    main { margin: 0 8px 8px; padding: 0 16px; } footer.credit, .intro { margin: 0 -16px; padding: 16px; }
    .metrics { grid-template-columns: 1fr; } .metric + .metric { border-left: 0; border-top: 1px solid var(--border); }
    .cols { display: none; }
    .kind__head { flex-direction: column; align-items: flex-start; gap: 8px; }
    .bot__row { grid-template-columns: 1fr auto 16px; row-gap: 4px; }
    .bot__who { grid-column: 1; grid-row: 2; }
    .bot__row .state { grid-column: 2; grid-row: 1; }
    .bot__n { grid-row: 3; text-align: left; }
    .bot__n::before { content: attr(data-l) ' '; color: var(--fg-muted); }
    .bot__n[data-k="v"] { grid-column: 1; } .bot__n[data-k="e"] { grid-column: 2; } .bot__n[data-k="u"] { display: none; }
    .chev { grid-column: 3; grid-row: 1; }
    .facts { grid-template-columns: 1fr; gap: 4px; } .facts dd + dt { margin-top: 12px; }
    .ptable__head { display: none; } .ptable__row { grid-template-columns: minmax(0, 1fr) auto; row-gap: 6px; } .ptable__path { grid-column: 1; grid-row: 1; } .ptable__n { grid-column: 2; grid-row: 1; } .ptable__row .codes { grid-column: 1; grid-row: 2; } .ptable__d { grid-column: 2; grid-row: 2; }
    .bot__more { padding: 14px 16px; }
  }
</style>

<script>
// Bots que se pueden ver en los logs: el nombre aparece en su user agent, como lo documenta cada empresa.

  { token: 'ChatGPT-User', company: 'OpenAI', product: 'ChatGPT', kind: 'user', source: 'https://developers.openai.com/api/docs/bots' },
  { token: 'Claude-User', company: 'Anthropic', product: 'Claude', kind: 'user', source: 'https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler' },
  { token: 'Google-Agent', company: 'Google', product: 'Agentes de Google', kind: 'user', source: 'https://developers.google.com/crawling/docs/crawlers-fetchers/google-user-triggered-fetchers' },
  { token: 'Perplexity-User', company: 'Perplexity', product: 'Perplexity', kind: 'user', source: 'https://docs.perplexity.ai/docs/resources/perplexity-crawlers' },
  { token: 'meta-externalfetcher', company: 'Meta', product: 'Sus productos de IA', kind: 'user', source: 'https://developers.facebook.com/docs/sharing/webmasters/web-crawlers' },
  { token: 'Amzn-User', company: 'Amazon', product: 'Alexa', kind: 'user', source: 'https://developer.amazon.com/amazonbot' },
  { token: 'MistralAI-User', company: 'Mistral', product: 'Vibe', kind: 'user', source: 'https://docs.mistral.ai/robots' },
  { token: 'GPTBot', company: 'OpenAI', product: 'Entrenar sus modelos', kind: 'train', source: 'https://developers.openai.com/api/docs/bots' },
  { token: 'ClaudeBot', company: 'Anthropic', product: 'Entrenar sus modelos', kind: 'train', source: 'https://support.claude.com/en/articles/8896518-does-anthropic-crawl-data-from-the-web-and-how-can-site-owners-block-the-crawler' },
  { token: 'meta-externalagent', company: 'Meta', product: 'Entrenar modelos y mejorar productos', kind: 'train', source: 'https://developers.facebook.com/docs/sharing/webmasters/web-crawlers' },
  { token: 'Amazonbot', company: 'Amazon', product: 'Mejorar productos y entrenar modelos', kind: 'train', source: 'https://developer.amazon.com/amazonbot' },
  { token: 'MistralAI-Training', company: 'Mistral', product: 'Entrenar sus modelos', kind: 'train', source: 'https://docs.mistral.ai/robots' },
];

// Logo de cada empresa, en la carpeta logos/ común a los ejercicios: se sirven desde aquí, sin pedir nada a terceros.
const LOGOS = { OpenAI: 'openai.svg', Google: 'google.svg', Microsoft: 'microsoft.svg', Anthropic: 'claude.svg', Perplexity: 'perplexity.png', Apple: 'apple.svg', Meta: 'meta.svg', DuckDuckGo: 'duckduckgo.svg', Amazon: 'amazon.png', Mistral: 'mistral.png' };

const KINDS = {
  search: { title: 'Buscadores', short: 'Buscadores', text: 'Rastrean tu web para que su buscador o su IA puedan mostrarte.' },
  user: { title: 'Visitas que pide una persona', short: 'A petición', text: 'Entran cuando alguien le pide a la IA que lea una página.' },
  train: { title: 'Entrenamiento de modelos', short: 'Entrenamiento', text: 'Recogen contenido para entrenar modelos de IA.' },
};

// ---------- Lector de logs ----------
// Lee tres formatos: el combinado de Apache y Nginx, el W3C (IIS, CloudFront) y el JSON por líneas (Cloudflare, Caddy, Google Cloud).
// El nombre del bot tiene que ir como palabra suelta: «Googlebot» no cuenta en «Googlebot-Image», ni «bingbot» en «bingbot.htm».
const BY_TOKEN = new Map(BOTS.map((b, i) => [b.token.toLowerCase(), i]));
const ANY_BOT = new RegExp('(?:^|[^A-Za-z0-9-])(' + [...BOTS].sort((a, b) => b.token.length - a.token.length).map(b => b.token.replace(/-/g, '\\-')).join('|') + ')(?![A-Za-z0-9.-])', 'i');
const MONTHS = { Jan: 0, Feb: 1, Mar: 2, Apr: 3, May: 4, Jun: 5, Jul: 6, Aug: 7, Sep: 8, Oct: 9, Nov: 10, Dec: 11 };

// Combinado: «[10/Oct/2026:13:55:36 +0000] "GET /ruta HTTP/1.1" 200». Se toma la hora del log, sin la zona.
const CLF_DATE = /\[(\d{2})\/(\w{3})\/(\d{4}):(\d{2}):(\d{2}):(\d{2})/;
const CLF_REQ = /\]\s+"(?:[A-Z]+\s+)?(\S+)[^"]*"\s+(\d{3})/;
function readCombined(line) {
  const d = CLF_DATE.exec(line);
  const r = CLF_REQ.exec(line);
  return {
    when: d ? Date.UTC(+d[3], MONTHS[d[2]] ?? 0, +d[1], +d[4], +d[5], +d[6]) : null,
    path: r ? r[1] : null,
    status: r ? +r[2] : null,
    ua: line,
  };
}

// W3C: las columnas las dice la línea «#Fields:». IIS escribe los espacios del user agent como «+» y CloudFront los codifica (%20).
const decode = s => { s = s.replace(/\+/g, ' '); try { return decodeURIComponent(s); } catch (e) { return s; } };
function readW3C(line, fields) {
  const v = line.includes('\t') ? line.split('\t') : line.trim().split(/\s+/);
  const get = k => { const i = fields.indexOf(k); return i < 0 || v[i] === undefined || v[i] === '-' ? null : v[i]; };
  const date = get('date'), time = get('time'), stem = get('cs-uri-stem'), query = get('cs-uri-query'), status = get('sc-status'), ua = get('cs(user-agent)');
  return {
    when: date && time ? Date.parse(date + 'T' + time + 'Z') : null,
    path: stem ? stem + (query ? '?' + query : '') : null,
    status: status && /^\d{3}$/.test(status) ? +status : null,
    ua: ua ? decode(ua) : '',
  };
}

// JSON: los nombres que usa cada servicio, según su documentación.
function toTime(x) {
  if (x === undefined || x === null || x === '') return null;
  if (typeof x === 'string' && !/^\d+(\.\d+)?$/.test(x)) { const t = Date.parse(x); return isNaN(t) ? null : t; }
  const n = +x;
  return n > 1e17 ? n / 1e6 : n > 1e14 ? n / 1e3 : n > 1e11 ? n : n * 1000; // ns, µs, ms o s
}
function readJSON(line) {
  let o;
  try { o = JSON.parse(line); } catch (e) { return null; }
  if (!o || typeof o !== 'object') return null;
  const req = o.request || {}, hr = o.httpRequest || {};
  const h = req.headers ? (req.headers['User-Agent'] || req.headers['user-agent']) : null;
  let path = o.ClientRequestURI ?? o.ClientRequestPath ?? req.uri ?? null;
  if (path === null && hr.requestUrl) { try { const u = new URL(hr.requestUrl); path = u.pathname + u.search; } catch (e) {} }
  const status = o.EdgeResponseStatus ?? o.status ?? hr.status ?? null;
  return {
    when: toTime(o.EdgeStartTimestamp ?? o.ts ?? o.timestamp ?? o.time),
    path,
    status: status === null || isNaN(+status) ? null : +status,
    ua: String(o.ClientRequestUserAgent ?? (Array.isArray(h) ? h.join(' ') : h) ?? hr.userAgent ?? ''),
  };
}

function emptyStats() {
  return { lines: 0, dated: 0, read: 0, first: null, last: null, bots: BOTS.map(() => ({ hits: 0, unparsed: 0, robots: 0, last: null, status: {}, pageStatus: {}, pages: new Map() })) };
}

// Cada archivo decide su formato con su primera línea útil; un nuevo «#Fields:» cambia las columnas.
function readLine(st, file, line) {
  if (!line || !line.trim()) return;
  if (line[0] === '#') {
    const f = /^#Fields:\s*(.*)$/i.exec(line);
    if (f) { file.mode = 'w3c'; file.fields = f[1].trim().split(/\s+/).map(x => x.toLowerCase()); }
    return;
  }
  st.lines++;
  if (!file.mode) file.mode = line.trimStart()[0] === '{' ? 'json' : 'clf';
  const e = (file.mode === 'w3c' ? readW3C(line, file.fields) : file.mode === 'json' ? readJSON(line) : readCombined(line))
    || { when: null, path: null, status: null, ua: line };
  if (e.when !== null && !isNaN(e.when)) {
    st.dated++;
    if (st.first === null || e.when < st.first) st.first = e.when;
    if (st.last === null || e.when > st.last) st.last = e.when;
  } else e.when = null;
  if (e.path !== null || e.status !== null) st.read++;
  const hit = ANY_BOT.exec(e.ua);
  if (!hit) return;
  const b = st.bots[BY_TOKEN.get(hit[1].toLowerCase())];
  b.hits++;
  if (e.path === null && e.status === null) { b.unparsed++; return; }
  if (e.when !== null && (b.last === null || e.when > b.last)) b.last = e.when;
  if (e.status !== null) {
    b.status[e.status] = (b.status[e.status] || 0) + 1;
    // Sin el robots.txt: un bot puede leerlo y tener cerradas todas las páginas
    if (!/^\/robots\.txt(\?|$)/.test(e.path || '')) b.pageStatus[e.status] = (b.pageStatus[e.status] || 0) + 1;
  }
  if (/^\/robots\.txt(\?|$)/.test(e.path || '')) b.robots++;
  if (e.path !== null && (b.pages.size < 5000 || b.pages.has(e.path))) {
    const pg = b.pages.get(e.path) || { n: 0, codes: {}, last: null };
    pg.n++;
    if (e.when !== null && (pg.last === null || e.when > pg.last)) pg.last = e.when;
    if (e.status !== null) pg.codes[e.status] = (pg.codes[e.status] || 0) + 1;
    b.pages.set(e.path, pg);
  }
}

// Lee el archivo por trozos, sin cargarlo entero; los .gz se descomprimen al vuelo.
async function readFile(file, st, onProgress) {
  let stream = file.stream();
  if (/\.gz$/i.test(file.name) || await isGzip(file)) stream = stream.pipeThrough(new DecompressionStream('gzip'));
  const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
  const state = { mode: null, fields: [] };
  let rest = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    const parts = (rest + value).split(/\r?\n/);
    rest = parts.pop();
    for (const l of parts) readLine(st, state, l);
    onProgress(st.lines);
  }
  readLine(st, state, rest);
}

async function isGzip(file) {
  const b = new Uint8Array(await file.slice(0, 2).arrayBuffer());
  return b[0] === 0x1f && b[1] === 0x8b;
}

// ---------- Interfaz ----------
// Cuenta el uso de la herramienta en GoatCounter: solo el nombre del evento, nunca lo que se pega o se sube.
const track = name => { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => n.toLocaleString('es-ES');
const day = t => new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
// Respuestas que le cierran la puerta: sin permiso, demasiadas peticiones o error del servidor. Un 404 no lo es.
const blocks = code => code === 401 || code === 403 || code === 429 || code >= 500;
let results = null, busy = false, period = '';

function say(text, bad) { const el = $('#msg'); el.textContent = text; el.hidden = !text; el.classList.toggle('is-bad', !!bad); }

const drop = $('.drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('is-over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, () => drop.classList.remove('is-over')));
drop.addEventListener('drop', e => { e.preventDefault(); run([...e.dataTransfer.files]); });
$('#files').addEventListener('change', e => run([...e.target.files]));
$('#reset').addEventListener('click', () => { $('#files').value = ''; say(''); results = null; $('#result').hidden = true; $('#form').hidden = false; renderNav(); window.scrollTo({ top: 0 }); });

async function run(files) {
  if (!files.length || busy) return;
  busy = true;
  results = null; $('#result').hidden = true; renderNav();
  const st = emptyStats();
  try {
    for (const f of files) {
      say(`Leyendo ${f.name}…`);
      await readFile(f, st, n => say(`Leyendo ${f.name}… ${num(n)} líneas`));
    }
    // Ni una fecha de log ni un bot: no parece un archivo de accesos
    if (!st.read && !st.dated && !st.bots.some(b => b.hits)) return say('No vemos ninguna visita en ese archivo. Tiene que ser el archivo de accesos de tu servidor, como access.log.', true);
    say('');
    render(st, files);
    track('logs-analizar');
  } catch (err) {
    say('No hemos podido leer el archivo. Tiene que ser texto, o texto comprimido en .gz.', true);
  } finally { busy = false; $('#files').value = ''; }
}

// Entra: alguna página le responde sin cerrarle la puerta. Le das error: todas se la cierran (sin contar el robots.txt).
function stateOf(b) {
  if (!b.hits) return ['dot--faint', 'No aparece'];
  // Lee el robots.txt y no pide nada más: lo normal cuando el robots.txt no le deja entrar
  if (b.robots && b.robots === b.hits - b.unparsed) return ['dot--faint', 'Solo el robots.txt'];
  const codes = Object.keys(b.pageStatus);
  if (!codes.length) return ['dot--success', 'Aparece'];
  return codes.every(c => blocks(+c)) ? ['dot--error', 'Le das error'] : ['dot--success', 'Entra'];
}

function render(st, files) {
  results = BOTS.map((b, i) => ({ ...b, ...st.bots[i] }));
  const visits = results.reduce((n, r) => n + r.hits, 0);
  const range = period = st.first !== null ? (day(st.first) === day(st.last) ? day(st.first) : `${day(st.first)} – ${day(st.last)}`) : 'Sin fechas';
  const seen = results.filter(r => r.hits).length;
  const errs = results.filter(r => stateOf(r)[0] === 'dot--error').length;
  $('#metrics').innerHTML =
    `<div class="metric"><b>${num(visits)}</b><span>${visits === 1 ? 'visita' : 'visitas'} de bots de IA</span></div>` +
    `<div class="metric"><b>${seen}<small> de ${BOTS.length}</small></b><span>bots aparecen en tus logs</span></div>` +
    `<div class="metric${errs ? ' is-bad' : ''}"><b>${errs}</b><span>${errs === 1 ? 'bot recibe' : 'bots reciben'} error en todas sus visitas</span></div>`;
  $('#period').textContent = `${st.first !== null ? range : 'Sin fechas'} · ${num(st.lines)} ${st.lines === 1 ? 'línea leída' : 'líneas leídas'}`;
  $('#kinds').innerHTML = Object.entries(KINDS).map(([k, info]) => `
    <section class="kind" id="k-${k}"><header class="kind__head"><div><h2>${info.title}</h2><p>${info.text}</p></div>${kindSummary(k)}</header>
      <div class="cols"><span>Bot</span><span>Para qué</span><span>Estado</span><span class="r">Visitas</span><span class="r">Con error</span><span class="r">Última</span><span></span></div>
      <ul class="bots">${results.filter(r => r.kind === k).map(botRow).join('')}</ul></section>`).join('');
  const warn = [];
  if (st.lines && !st.read) warn.push('No reconocemos el formato de tus logs: contamos las visitas de cada bot, pero no sabemos a qué páginas fueron ni qué les respondiste. Lee el formato de Apache y Nginx, el W3C de IIS y CloudFront, y el JSON de Cloudflare, Caddy y Google Cloud.');
  $('#warn').innerHTML = warn.join(' ');
  $('#warn').hidden = !warn.length;
  $('#result').hidden = false;
  $('#form').hidden = true; window.scrollTo({ top: 0 });
  renderNav();
}

// Cómo va cada grupo, en una línea: cuántos aparecen y a cuántos les das error
function kindSummary(k) {
  const rows = results.filter(r => r.kind === k);
  const seen = rows.filter(r => r.hits).length, err = rows.filter(r => stateOf(r)[0] === 'dot--error').length;
  return `<p class="kind__sum"><span>${seen} de ${rows.length} aparecen</span>${err ? `<span class="is-bad"><span class="dot dot--error"></span>${err} con error</span>` : ''}</p>`;
}

const shortDay = t => new Date(t).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', timeZone: 'UTC' });

// Cada código, con el color de lo que significa para el bot
function codeKind(c) {
  c = +c;
  if (blocks(c)) return ['is-bad', 'Le cierras la puerta'];
  if (c >= 400) return ['is-gone', 'La página no existe'];
  if (c === 304) return ['is-redir', 'La página no ha cambiado desde su última visita'];
  if (c >= 300) return ['is-redir', 'Le redirige a otra página'];
  return ['is-ok', 'La página le respondió bien'];
}
const codeChip = (c, n, tag = 'span') => { const [k, t] = codeKind(c); return `<${tag} class="code ${k}"${tag === 'button' ? ` type="button" data-code="${c}"` : ''} title="${c} · ${t}"><i>${c}</i>${num(n)}</${tag}>`; };
const errorsOf = codes => Object.entries(codes).filter(([c]) => blocks(+c)).reduce((n, [, v]) => n + v, 0);

// Tabla de páginas: sin filtro, primero las que dan error; con un código, solo las páginas que lo dieron
function pagesTable(r, code, limit = 10) {
  let all = [...r.pages].map(([p, v]) => ({ p, n: v.n, codes: v.codes, last: v.last, err: errorsOf(v.codes) }));
  if (code) all = all.filter(x => x.codes[code]).sort((a, b) => b.codes[code] - a.codes[code] || b.n - a.n);
  else all.sort((a, b) => b.err - a.err || b.n - a.n);
  const shown = all.slice(0, limit), rest = all.length - shown.length;
  return `<div class="ptable__head"><span>Página</span><span>Respuestas</span><span>Visitas</span><span>Última</span></div>
    ${shown.map(x => `<div class="ptable__row${x.err ? ' is-bad' : ''}"><span class="ptable__path" title="${esc(x.p)}">${esc(x.p)}</span><span class="codes">${Object.entries(x.codes).sort((a, b) => b[1] - a[1]).map(([c, n]) => codeChip(c, n)).join('')}</span><span class="ptable__n">${num(x.n)}</span><span class="ptable__d">${x.last !== null ? shortDay(x.last) : '—'}</span></div>`).join('')}
    ${rest > 0 ? `<p class="ptable__more">Y ${num(rest)} ${rest === 1 ? 'página más' : 'páginas más'}${code ? ` con ${code}` : ''}. <button class="linkbtn" type="button" data-more="${limit + 20}">Ver ${Math.min(20, rest)} más</button></p>` : ''}`;
}

function botRow(r) {
  const [dot, label] = stateOf(r);
  const bad = errorsOf(r.pageStatus);
  const cell = (k, l, v, cls = '') => `<span class="bot__n ${cls}" data-k="${k}" data-l="${l}">${v}</span>`;
  const source = `<dt>Fuente</dt><dd><a href="${esc(r.source)}" target="_blank" rel="noopener">Documentación de ${esc(r.company)}</a></dd>`;
  let more;
  if (!r.hits) more = `<dl class="facts">
      <dt>En estos logs</dt><dd>Ninguna visita${period && period !== 'Sin fechas' ? `, del ${esc(period.replace(' – ', ' al '))}` : ''}.</dd>
      <dt>Puede ser porque</dt><dd>No pasó en esas fechas, o tu CDN lo para antes de que llegue a tu servidor. Con logs de más días es más fácil verlo.</dd>
      ${source}</dl>`;
  else {
    const codes = Object.entries(r.status).sort((a, b) => b[1] - a[1]);
    const table = r.pages.size ? `<div class="ptable">${pagesTable(r)}</div>` : '';
    const notes = [];
    if (r.robots && r.robots === r.hits - r.unparsed) notes.push('Solo pidió el robots.txt: si en él le cierras tu web, no pide nada más.');
    else if (dot === 'dot--error') notes.push('Todas sus visitas a tus páginas acabaron en error: mira si lo bloquea tu CDN, tu servidor o un plugin de seguridad.');
    else if (bad) notes.push('Algunas páginas le dan error: son las primeras de la tabla.');
    if (r.unparsed) notes.push(`En ${num(r.unparsed)} ${r.unparsed === 1 ? 'visita' : 'visitas'} tu log no dice la página ni la respuesta.`);
    more = `<dl class="facts">
      ${codes.length ? `<dt>Qué le respondiste</dt><dd><span class="codes">${codes.map(([c, n]) => codeChip(c, n, r.pages.size ? 'button' : 'span')).join('')}</span>${r.pages.size && codes.length > 1 ? '<small class="hint">Pulsa un código para ver solo sus páginas.</small>' : ''}</dd>` : ''}
      ${table ? `<dt>Páginas</dt><dd>${table}</dd>` : ''}
      ${notes.length ? `<dt>A tener en cuenta</dt><dd>${notes.join(' ')}</dd>` : ''}
      ${source}</dl>`;
  }
  return `<li class="bot" data-i="${BOTS.indexOf(BOTS.find(b => b.token === r.token))}"><button class="bot__row" type="button" aria-expanded="false">
      <span class="bot__token">${esc(r.token)}</span>
      <span class="bot__who"><img class="bot__logo" src="../logos/${LOGOS[r.company]}" alt="${esc(r.company)}" title="${esc(r.company)}" width="18" height="18">${esc(r.product)}</span>
      <span class="state"><span class="dot ${dot}"></span>${label}</span>
      ${cell('v', 'Visitas', r.hits ? num(r.hits) : '—', r.hits ? '' : 'is-none')}
      ${cell('e', 'Con error', bad ? num(bad) : '—', bad ? 'is-bad' : 'is-none')}
      ${cell('u', 'Última', r.last !== null ? shortDay(r.last) : '—', r.last !== null ? '' : 'is-none')}
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="bot__more">${more}</div></li>`;
}

// Menú: un punto por grupo, rojo si a algún bot le das error, verde si entran y gris si no aparece ninguno.
function renderNav() {
  $('#nav').innerHTML = Object.entries(KINDS).map(([k, info], i) => {
    const rows = results ? results.filter(r => r.kind === k) : [];
    const seen = rows.filter(r => r.hits).length;
    const err = rows.filter(r => stateOf(r)[0] === 'dot--error').length;
    // Solo un punto; el detalle, al pasar el ratón
    const [dot, tip] = err ? ['dot--error', `${err} con error`] : seen ? ['dot--success', `${seen} ${seen === 1 ? 'entra' : 'entran'}`] : ['dot--faint', 'Ninguno aparece'];
    const c = results ? `<span class="dot ${dot}"></span>` : '';
    return `<button class="nav ${results ? '' : 'is-locked'}" data-k="${k}" title="${results ? tip : 'Sube primero tus logs'}"><span class="n">0${i + 1}</span><span>${info.short}</span><span class="c">${c}</span></button>`;
  }).join('');
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b && results) document.getElementById('k-' + b.dataset.k).scrollIntoView({ behavior: 'smooth' });
});

$('#kinds').addEventListener('click', e => {
  const chip = e.target.closest('button.code');
  if (chip) {
    const li = chip.closest('.bot'), r = results[+li.dataset.i];
    const on = !chip.classList.contains('is-active');
    li.querySelectorAll('button.code').forEach(b => { b.classList.toggle('is-active', on && b === chip); b.classList.toggle('is-dim', on && b !== chip); });
    li.dataset.code = on ? chip.dataset.code : '';
    li.querySelector('.ptable').innerHTML = pagesTable(r, li.dataset.code || null);
    if (on) track('logs-filtrar-codigo');
    return;
  }
  // «Ver más»: muestra las siguientes páginas, con el filtro que haya puesto
  const more = e.target.closest('[data-more]');
  if (more) {
    const li = more.closest('.bot');
    li.querySelector('.ptable').innerHTML = pagesTable(results[+li.dataset.i], li.dataset.code || null, +more.dataset.more);
    return;
  }
  const row = e.target.closest('.bot__row');
  if (!row) return;
  const li = row.parentElement;
  li.classList.toggle('is-open');
  row.setAttribute('aria-expanded', li.classList.contains('is-open'));
});

renderNav();
</script>
</body>
</html>
