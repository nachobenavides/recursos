<title>¿Pueden entrar los bots de IA? · Microherramienta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0b; --bg-elevated: #111111; --border: #2b2b2b; --border-strong: #404040;
    --fg: #d4d4d4; --fg-muted: #a3a3a3; --fg-strong: #f5f5f5;
    --success: #10b981; --error: #ef4444;
    --sans: 'Archivo', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', monospace;
    --tracking-eyebrow: 0.18em; --tracking-tightest: -0.025em;
    --r-sm: 4px; --r-md: 8px; --r-lg: 12px; --r-full: 9999px;
    --shadow-key: 0 1px 0 rgba(255, 255, 255, 0.18);
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: var(--fg-strong); text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  a:hover { text-decoration-color: var(--fg-strong); }
  code { font: 12.5px var(--mono); color: var(--fg-strong); }
  .mono { font-family: var(--mono); font-size: 11px; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--fg-muted); }

  /* La misma carcasa que «Dónde deberías estar»: menú a la izquierda y el contenido en una tarjeta. */
  .app { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: 100vh; }
  aside { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; padding: 28px 16px 24px; }
  .side-brand { display: inline-flex; align-items: center; gap: 8px; margin: 0 12px 28px; color: var(--fg-muted); text-decoration: none; font-size: 13px; }
  .side-brand img { width: 22px; height: 22px; object-fit: contain; }
  .side-brand:hover { color: var(--fg-strong); }
  .side-title { padding: 0 12px 10px; }
  .nav { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; padding: 9px 12px; border-radius: var(--r-md); cursor: pointer; font-size: 14px; color: var(--fg-muted); transition: background-color 200ms var(--ease), color 200ms var(--ease); }
  .nav:hover { color: var(--fg-strong); background: rgba(17, 17, 17, 0.6); }
  .nav .n { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; color: rgba(163, 163, 163, 0.4); }
  .nav.is-locked { opacity: 0.35; cursor: not-allowed; }
  .nav.is-locked:hover { color: var(--fg-muted); background: none; }
  .nav .c { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-muted); white-space: nowrap; }
  .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .dot--success { background: var(--success); }
  .dot--error { background: var(--error); }
  .dot--faint { background: rgba(163, 163, 163, 0.35); }
  .side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 2px; }

  main { display: flex; flex-direction: column; margin: 8px 8px 8px 0; min-height: calc(100vh - 16px); padding: 0 24px; border: 1px solid var(--border); border-radius: var(--r-lg); background: var(--bg-elevated); }
  .intro { margin: 0 -24px; padding: 16px 24px; border-bottom: 1px solid var(--border); border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .intro__row { display: flex; align-items: center; gap: 14px; }
  .intro__row img { flex: none; width: 26px; height: 26px; border-radius: var(--r-full); object-fit: cover; filter: grayscale(1); }
  h1 { margin: 0; font-size: 15px; font-weight: 500; line-height: 1.4; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }

  .spacer { flex: 1 0 48px; }
  footer.credit { position: sticky; bottom: 0; margin: 0 -24px; padding: 16px 24px 18px; border-radius: 0 0 var(--r-lg) var(--r-lg); border-top: 1px solid var(--border); background: var(--bg-elevated); display: flex; justify-content: space-between; }
  footer.credit { align-items: center; }
  .credit__sig { display: inline-flex; align-items: center; gap: 10px; font-size: 13px; color: var(--fg-muted); text-decoration: none; }
  .credit__sig img { width: 18px; height: 18px; object-fit: contain; opacity: 0.85; }
  .credit__sig strong { font-weight: 500; color: var(--fg); }
  .credit__sig:hover strong, .credit__talk:hover { color: var(--fg-strong); }
  .credit__talk { text-decoration: none; }

  /* Entrada: los mismos campos que el formulario de «Dónde deberías estar». */
  form { margin-top: 28px; max-width: 760px; display: grid; gap: 22px; }
  form label { display: flex; flex-direction: column; gap: 8px; }
  form small { font-size: 13px; color: var(--fg-muted); }
  textarea, .field { width: 100%; border: 1px solid var(--border); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.03); color: var(--fg-strong); transition: border-color 150ms var(--ease); }
  textarea { display: block; min-height: 220px; resize: vertical; padding: 12px 14px; font: 13px/1.6 var(--mono); }
  .field { height: 40px; padding: 0 12px; font: 13px var(--mono); }
  textarea:hover, .field:hover { border-color: var(--border-strong); }
  textarea:focus, .field:focus { outline: none; border-color: var(--fg-muted); }
  textarea::placeholder, .field::placeholder { color: rgba(163, 163, 163, 0.35); }
  .btn { all: unset; cursor: pointer; justify-self: start; display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 22px; border-radius: var(--r-full); font-size: 14px; font-weight: 500; white-space: nowrap; background: var(--fg-strong); color: var(--bg); box-shadow: var(--shadow-key); transition: background-color 150ms var(--ease); }
  .btn:hover { background: var(--fg); }
  .msg { margin: -10px 0 0; font-size: 13px; color: var(--error); }

  /* Editor del robots.txt: números de línea a la izquierda; «Ver línea» resalta una un momento. */
  .editor { position: relative; }
  .editor textarea { padding-left: 58px; white-space: pre; overflow-wrap: normal; overflow-x: auto; }
  .editor__gutter { position: absolute; top: 1px; bottom: 1px; left: 1px; width: 44px; overflow: hidden; pointer-events: none; border-right: 1px solid var(--border); border-radius: var(--r-md) 0 0 var(--r-md); }
  .editor__nums { padding: 12px 10px 12px 0; text-align: right; font: 13px/1.6 var(--mono); color: rgba(163, 163, 163, 0.4); font-variant-numeric: tabular-nums; }
  .editor__nums div.is-hl { color: var(--fg-strong); }
  .editor__hl { position: absolute; left: 1px; right: 1px; pointer-events: none; background: color-mix(in srgb, var(--error) 16%, transparent); box-shadow: inset 2px 0 0 var(--error); opacity: 0; transition: opacity 500ms var(--ease); }
  .editor__hl.is-on { opacity: 1; transition: none; }
  .linkbtn { all: unset; cursor: pointer; color: var(--fg-strong); text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
  .linkbtn:hover { text-decoration-color: var(--fg-strong); }

  /* Resultado */
  .metrics { display: grid; grid-template-columns: repeat(2, 1fr); max-width: 760px; border: 1px solid var(--border); border-radius: var(--r-lg); margin-top: 32px; }
  .metric { padding: 20px 22px; }
  .metric + .metric { border-left: 1px solid var(--border); }
  .metric b { display: block; margin-bottom: 6px; font-size: 32px; font-weight: 500; line-height: 1; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .metric span { font-size: 13px; color: var(--fg-muted); }
  .kind { margin-top: 32px; scroll-margin-top: 16px; }
  .kind h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: var(--tracking-tightest); color: var(--fg-strong); }
  .kind > p { margin: 2px 0 12px; font-size: 13px; color: var(--fg-muted); }
  .bots { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--border); }
  .bot { border-bottom: 1px solid var(--border); }
  .bot__row { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 200px minmax(0, 1.1fr) 130px minmax(0, 1fr) 16px; gap: 28px; align-items: center; padding: 14px 8px; }
  .bot__row:hover { background: rgba(255, 255, 255, 0.02); }
  .bot__token { font: 13px var(--mono); color: var(--fg-strong); overflow-wrap: anywhere; }
  .bot__who, .bot__why { font-size: 13px; color: var(--fg-muted); min-width: 0; }
  .bot__who { display: flex; align-items: center; gap: 10px; }
  .bot__logo { flex: none; width: 18px; height: 18px; object-fit: contain; }
  .state { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--fg-strong); }
  .chev { color: var(--fg-muted); transition: transform 200ms var(--ease); }
  .bot.is-open .chev { transform: rotate(180deg); }
  .bot__why code { color: var(--fg); }
  .bot__why--none { color: rgba(163, 163, 163, 0.45); }
  .bot__more { display: none; padding: 0 8px 16px; }
  .bot.is-open .bot__more { display: block; }
  .facts { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 12px 28px; margin: 0; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--r-md); background: rgba(255, 255, 255, 0.02); font-size: 13px; }
  .facts dt { color: var(--fg-muted); }
  .facts dd { margin: 0; color: var(--fg); }
  .facts dd .linkbtn { margin-left: 12px; }

  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); } aside { position: static; height: auto; padding-bottom: 12px; } .side-foot { margin-top: 20px; }
    main { margin: 0 8px 8px; padding: 0 16px; } footer.credit, .intro { margin: 0 -16px; padding: 16px; }
    .metrics { grid-template-columns: 1fr 1fr; }
    .bot__row { grid-template-columns: 1fr auto 16px; row-gap: 4px; }
    .bot__who { grid-column: 1; grid-row: 2; }
    .bot__row .state { grid-column: 2; grid-row: 1; }
    .bot__why { grid-column: 1 / -1; grid-row: 3; }
    .bot__why--none { display: none; }
    .facts { grid-template-columns: 1fr; gap: 2px; padding: 14px 16px; } .facts dd + dt { margin-top: 10px; } .facts dd .linkbtn { display: table; margin: 6px 0 0; }
    .chev { grid-column: 3; grid-row: 1; }
  }
</style>

function parse(text) {
  const groups = [], lines = [];

  if (named.length) return { kind: 'named', groups: named };
  const star = parsed.groups.filter(g => g.agents.some(a => a.name === '*'));
  return star.length ? { kind: 'star', groups: star } : { kind: 'none', groups: [] };
}

function toRegex(p) {
  const end = p.endsWith('$');
  const body = pct(end ? p.slice(0, -1) : p).split('*').map(s => s.replace(/[.+?^${}()|[\]\\]/g, '\\$&')).join('.*');
  return new RegExp('^' + body + (end ? '$' : ''));
}

// Gana la regla más larga que encaja; si empatan, la menos restrictiva (Allow).
function evaluate(parsed, token, path) {
  const g = groupsFor(parsed, token);
  const rules = g.groups.flatMap(x => x.rules);
  const p = pct(path);
  let best = null;
  for (const r of rules) {
    if (r.path === '' || !toRegex(r.path).test(p)) continue;
    if (!best || r.path.length > best.path.length || (r.path.length === best.path.length && r.type === 'allow' && best.type !== 'allow')) best = r;
  }
  return { allowed: !best || best.type === 'allow', via: g.kind, groups: g.groups, rule: best };
}

// ---------- Interfaz ----------
// Cuenta el uso de la herramienta en GoatCounter: solo el nombre del evento, nunca lo que se pega o se sube.
const track = name => { try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: name, title: name, event: true }); } catch (e) {} };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let lastText = null, results = null;

function normPath(v) {
  v = (v || '/').trim();
  try { if (/^https?:\/\//i.test(v)) { const u = new URL(v); v = u.pathname + u.search; } } catch (e) {}
  v = v.replace(/#.*$/, '');
  return v.startsWith('/') ? v : '/' + v;
}

// Menú: un grupo de bots por línea; tras comprobar, cuántos están bloqueados en cada uno.
function renderNav() {
  $('#nav').innerHTML = Object.entries(KINDS).map(([k, info], i) => {
    const rows = results ? results.filter(r => r.kind === k) : [];
    const no = rows.filter(r => r.allowed === false).length;
    // Solo un punto: rojo si hay alguno bloqueado; el detalle, al pasar el ratón
    const tip = no ? `${no} ${no === 1 ? 'bloqueado' : 'bloqueados'}` : 'Todos entran';
    const c = results ? `<span class="dot ${no ? 'dot--error' : 'dot--success'}"></span>` : '';
    return `<button class="nav ${results ? '' : 'is-locked'}" data-k="${k}" title="${results ? tip : 'Comprueba primero tu robots.txt'}"><span class="n">0${i + 1}</span><span>${info.short}</span><span class="c">${c}</span></button>`;
  }).join('');
}
$('#nav').addEventListener('click', e => {
  const b = e.target.closest('[data-k]');
  if (b && results) document.getElementById('k-' + b.dataset.k).scrollIntoView({ behavior: 'smooth' });
});

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const txt = $('#text').value;
  $('#msg').hidden = !!txt.trim();
  if (!txt.trim()) { $('#msg').textContent = 'Pega el contenido de tu robots.txt.'; return reset(false); }
  lastText = txt;
  render();
  track('robots-comprobar');
});
$('#path').addEventListener('change', () => { if (lastText !== null) render(); });
$('#reset').addEventListener('click', () => { $('#text').value = ''; $('#path').value = '/'; $('#msg').hidden = true; reset(true); });

function reset(focus) {
  lastText = null; results = null;
  $('#result').hidden = true;
  renderNav();
  if (focus) { window.scrollTo({ top: 0 }); $('#text').focus(); }
}

function render() {
  const path = normPath($('#path').value);
  $('#path').value = path;
  const parsed = parse(lastText);
  results = BOTS.map(b => {
    let r = evaluate(parsed, b.token, path);
    // Amazon no dice qué buscadores toma como referencia: sin grupo propio, no se puede saber
    if (r.via !== 'named' && b.unnamedRule && parsed.groups.length) r = { ...r, allowed: null, rule: null };
    if (r.via !== 'named' && b.fallback && groupsFor(parsed, b.fallback).kind === 'named') r = { ...evaluate(parsed, b.fallback, path), via: 'fallback' };
    return { ...b, ...r };
  });
  const ok = results.filter(r => r.allowed === true).length;
  const no = results.filter(r => r.allowed === false).length;
  $('#metrics').innerHTML =
    `<div class="metric"><b>${ok}</b><span>${ok === 1 ? 'permitido' : 'permitidos'} en <code>${esc(path)}</code></span></div>` +
    `<div class="metric"><b>${no}</b><span>${no === 1 ? 'bloqueado' : 'bloqueados'}</span></div>`;
  $('#kinds').innerHTML = Object.entries(KINDS).map(([k, info]) => `
    <section class="kind" id="k-${k}"><h2>${info.title}</h2><p>${info.text}</p>
      <ul class="bots">${results.filter(r => r.kind === k).map(botRow).join('')}</ul></section>`).join('');
  $('#result').hidden = false;
  renderNav();
}

function botRow(r) {
  const link = (txt, url) => `<a href="${esc(url)}" target="_blank" rel="noopener">${txt}</a>`;
  const ruleCode = r.rule ? `<code>${r.rule.type === 'allow' ? 'Allow' : 'Disallow'}: ${esc(r.rule.path)}</code>` : '';
  // En la fila cerrada, solo lo que explica el estado: la regla que decide o por qué no se sabe
  const why = r.allowed === null ? '<span class="bot__why">Depende de otros buscadores</span>'
    : r.rule ? `<span class="bot__why">Línea ${r.rule.line} · ${ruleCode}</span>`
    : '<span class="bot__why bot__why--none">Sin reglas que la cierren</span>';
  const group = r.via === 'named' ? 'Su propio grupo'
    : r.via === 'fallback' ? `El de <code>${esc(r.fallback)}</code>: Apple sigue ese grupo si no tiene uno propio`
    : r.allowed === null ? 'No tiene grupo propio'
    : r.via === 'star' ? '<code>User-agent: *</code>, porque no tiene grupo propio'
    : 'Ninguno: no tiene grupo propio ni hay <code>User-agent: *</code>';
  const rule = r.allowed === null ? 'No se puede saber' : r.rule
    ? `Línea ${r.rule.line} · ${ruleCode}<button class="linkbtn" type="button" data-line="${r.rule.line}">Ver en tu robots.txt</button>`
    : 'Ninguna cierra esta página';
  const note = r.allowed === null ? esc(r.unnamedRule) : r.note ? (r.noteSource ? link(esc(r.note), r.noteSource) : esc(r.note)) : '';
  const state = r.allowed === null ? ['dot--faint', 'Sin saber'] : r.allowed ? ['dot--success', 'Permitido'] : ['dot--error', 'Bloqueado'];
  return `<li class="bot"><button class="bot__row" type="button" aria-expanded="false">
      <span class="bot__token">${esc(r.token)}</span>
      <span class="bot__who"><img class="bot__logo" src="logos/${LOGOS[r.company]}" alt="${esc(r.company)}" title="${esc(r.company)}" width="18" height="18">${esc(r.product)}</span>
      <span class="state"><span class="dot ${state[0]}"></span>${state[1]}</span>
      ${why}
      <svg class="chev" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
    <div class="bot__more"><dl class="facts">
      <dt>Grupo que le aplica</dt><dd>${group}</dd>
      <dt>Regla que decide</dt><dd>${rule}</dd>
      ${note ? `<dt>A tener en cuenta</dt><dd>${note}</dd>` : ''}
      <dt>Fuente</dt><dd>${link('Documentación de ' + esc(r.company), r.source)}</dd>
    </dl></div></li>`;
}

$('#kinds').addEventListener('click', e => {
  const go = e.target.closest('[data-line]');
  if (go) return showLine(+go.dataset.line);
  const row = e.target.closest('.bot__row');
  if (!row) return;
  const li = row.parentElement;
  li.classList.toggle('is-open');
  row.setAttribute('aria-expanded', li.classList.contains('is-open'));
});

// ---------- Editor: números de línea y «Ver línea» ----------
const ta = $('#text'), nums = $('#nums'), hl = $('#hl');
const lineH = () => parseFloat(getComputedStyle(ta).lineHeight);
let hlLine = 0, hlTimer = null;
function renderNums() {
  const n = Math.max(1, ta.value.split(/\r\n|\r|\n/).length);
  nums.innerHTML = Array.from({ length: n }, (_, i) => `<div${i + 1 === hlLine ? ' class="is-hl"' : ''}>${i + 1}</div>`).join('');
  syncScroll();
}
function syncScroll() {
  nums.style.transform = `translateY(${-ta.scrollTop}px)`;
  if (hlLine) {
    const top = 1 + 12 + (hlLine - 1) * lineH() - ta.scrollTop;
    hl.style.top = top + 'px'; hl.style.height = lineH() + 'px';
    hl.style.visibility = top < 0 || top + lineH() > ta.offsetHeight ? 'hidden' : 'visible';
  }
}
function showLine(n) {
  hlLine = n;
  ta.scrollTop = Math.max(0, (n - 1) * lineH() - ta.clientHeight / 2 + lineH());
  renderNums();
  ta.closest('.editor').scrollIntoView({ behavior: 'smooth', block: 'center' });
  clearTimeout(hlTimer);
  hl.classList.add('is-on');
  // Se queda un momento y se apaga
  hlTimer = setTimeout(() => { hl.classList.remove('is-on'); hlTimer = setTimeout(() => { hlLine = 0; renderNums(); }, 500); }, 1800);
  track('robots-ver-linea');
}
ta.addEventListener('input', renderNums);
ta.addEventListener('scroll', syncScroll);
$('#reset').addEventListener('click', renderNums);
renderNums();

renderNav();
</script>
</body>
</html>
